<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leader tools</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../assets/img/ho-icon.png">
<link rel="stylesheet" href="../assets/css/ho-fonts.css">
<link rel="stylesheet" href="../assets/css/ho-core.css">
<script src="../assets/js/ho-ui.js"></script>
<style>
:root{--bg:var(--ho-night);--surface:var(--ho-surface);--surface2:var(--ho-surface-2);--text:var(--ho-text);--muted:var(--ho-muted);--line:var(--ho-line);--accent:var(--ho-spectral);--btn:var(--ho-ember);--btn-ink:var(--ho-ember-ink);--header:rgba(7,15,21,.86);--pad:var(--ho-pad);--display:var(--ho-display);--body:var(--ho-body)}
:root[data-theme="light"]{--header:rgba(243,237,222,.9)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1.0625rem/1.6 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--ho-focus);outline-offset:2px}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:50;background:var(--header);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{padding:.5rem var(--pad);display:flex;align-items:center;gap:.7rem}
.mark{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--display);font-size:1.5rem;line-height:1;color:var(--text);text-decoration:none;white-space:nowrap}
.mark img{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1px var(--ho-gold-dim)}
.back{margin-left:auto;padding:.5em .9em;border-radius:99px;border:1.5px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:.95rem;min-height:40px;display:inline-flex;align-items:center}
.back:hover{background:var(--surface2)}
.switch{display:inline-flex;align-items:center;gap:.5rem;font:inherit;font-size:.95rem;background:none;color:var(--text);border:1.5px solid var(--line);border-radius:99px;padding:.2rem .8rem .2rem .3rem;cursor:pointer;min-height:40px;white-space:nowrap}
.switch .track{position:relative;width:2.6rem;height:1.45rem;border-radius:99px;background:var(--muted);flex:none}
.switch .knob{position:absolute;top:.17rem;left:.17rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--surface)}
.switch[aria-checked="true"] .track{background:var(--accent)}.switch[aria-checked="true"] .knob{left:calc(100% - 1.27rem)}
main{padding:clamp(1.4rem,4vw,2.6rem) var(--pad) 3rem;max-width:40rem}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0 0 .5rem}
.eyebrow{margin:0 0 .6rem;font:700 .78rem/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--ho-gold)}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:1rem 1.2rem;margin:1rem 0}
label{display:block;font-weight:700;margin:0 0 .25rem}
input[type=password],input[type=text]{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.8rem 0 0}
.btn{font:inherit;font-weight:700;font-size:1rem;border-radius:99px;border:1.5px solid var(--line);background:none;color:var(--text);padding:.5em 1.1em;min-height:44px;cursor:pointer}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{margin:.8rem 0 0;border-left:4px solid var(--ho-ember);padding:.3rem .8rem;background:var(--surface2);font-weight:700}
[hidden]{display:none!important}
@media (max-width:560px){.back{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script data-goatcounter="https://ohmoellermoeterm.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="//gc.zgo.at/count.js"></script>
<script src="../assets/js/ho-track.js"></script>
</head>

<header class="top"><div class="top-in">
  <a class="mark" href="../" aria-label="Haunted Ohio home"><img src="../assets/img/ho-icon.png" alt="" width="36" height="36"><span>Haunted Ohio</span></a>
  <a class="back" href="../">Back to the course site</a>
  <button class="switch" id="theme" type="button" role="switch" aria-checked="true" aria-label="Dark mode"><span class="track" aria-hidden="true"><span class="knob"></span></span><span aria-hidden="true">Dark mode</span></button>
</div></header>
<main id="main">
  <p class="eyebrow">For leaders</p>
  <h1>Leader tools</h1>
  <form id="f" class="panel" autocomplete="off">
    <label for="pw">Enter the leader password</label>
    <input type="password" id="pw" autocomplete="off" spellcheck="false" aria-describedby="err" required>
    <p class="err" id="err" role="alert" hidden></p>
    <div class="row">
      <button type="button" class="btn" id="tog" aria-pressed="false" aria-controls="pw">Show</button>
      <button type="submit" class="btn primary" id="go">Unlock</button>
    </div>
  </form>

</main>

<script>
(function () {
  'use strict';
  function $(s) { return document.querySelector(s); }
  var vault = JSON.parse($('#vault').textContent);
  var pw = $('#pw'), err = $('#err'), go = $('#go'), tog = $('#tog'), th = $('#theme');
  var fails = 0, busy = false;
  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length), i; for (i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  tog.addEventListener('click', function () { var show = tog.getAttribute('aria-pressed') !== 'true'; tog.setAttribute('aria-pressed', show ? 'true' : 'false'); tog.textContent = show ? 'Hide' : 'Show'; pw.type = show ? 'text' : 'password'; });
  function themePaint() { var dark = document.documentElement.getAttribute('data-theme') !== 'light'; th.setAttribute('aria-checked', dark ? 'true' : 'false'); th.setAttribute('aria-label', dark ? 'Dark mode' : 'Light mode'); th.lastChild.textContent = dark ? 'Dark mode' : 'Light mode'; }
  th.addEventListener('click', function () { if (window.HO && HO.theme) HO.theme.toggle(); themePaint(); });
  themePaint();
  /* a correct password replaces this page with the decrypted one; its scripts run, and a Lock again button is added */
  function open(html) {
    var again = '<button type="button" id="ho-lock-again" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;font:700 16px/1.2 system-ui,sans-serif;padding:10px 16px;min-height:44px;border-radius:99px;border:2px solid #c8531f;background:#c8531f;color:#fff;cursor:pointer">Lock again</button>'
      + '<' + 'script>document.getElementById("ho-lock-again").addEventListener("click",function(){location.reload()});<' + '/script>';
    var at = html.toLowerCase().lastIndexOf('</body>');
    html = at >= 0 ? html.slice(0, at) + again + html.slice(at) : html + again;
    document.open(); document.write(html); document.close();
  }
  function fail() {
    fails++; busy = true; go.disabled = true;
    err.textContent = 'That password didn\'t work.'; err.hidden = false;
    pw.value = '';
    /* a short pause after every failure, longer after each repeat (1 s, 2 s, 4 s ... up to 30 s) */
    setTimeout(function () { busy = false; go.disabled = false; pw.focus(); }, Math.min(30000, 1000 * Math.pow(2, fails - 1)));
  }
  $('#f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy || !pw.value) return;
    busy = true; go.disabled = true; err.hidden = true;
    var pass = pw.value, enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(vault.salt), iterations: vault.iter, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(vault.iv) }, key, b64(vault.ct)); })
      .then(function (buf) { var html = new TextDecoder().decode(buf); pw.value = ''; open(html); }, function () { fail(); });
  });
})();
</script>
