<style>
:root{
  --ink:#0b0e14;--night:#111a2b;--steel:#1b2638;--steel2:#26344b;
  --paper:#e6d9b8;--paper2:#d6c496;--pink:#2a2113;--sepia:#8a6d3b;
  --red:#c0303a;--text:#e9e4d4;--muted:#9fa8ba;--ok:#7dbb89;--warn:#e0a94a;
  --type:'Special Elite','Courier New',monospace;--ui:'Atkinson Hyperlegible',system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#18253d 0,var(--ink) 60%) fixed;color:var(--text);font-family:var(--ui);font-size:1.05rem;line-height:1.55;min-height:100vh;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:var(--type);font-weight:400;line-height:1.15;margin:0 0 .6rem}
h1{font-size:clamp(2.3rem,8vw,4.6rem)}h2{font-size:1.7rem}h3{font-size:1.2rem}
p{margin:0 0 .8rem}
a{color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:1rem}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.btn{background:var(--red);border:0;color:#fff;padding:.75rem 1.25rem;border-radius:3px;font-weight:700;min-height:44px}
.btn:hover{background:#d63c47}
.btn.ghost{background:transparent;border:2px solid var(--muted);color:var(--text)}
.btn.ghost:hover{border-color:var(--warn);color:var(--warn);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.45rem .8rem;min-height:38px;font-size:.95rem}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,14,20,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--steel2)}
.bar-in{max-width:1120px;margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--type);font-size:1.15rem;color:var(--text);text-decoration:none;margin-right:auto}
.brand img{width:38px;height:38px;border-radius:50%}
.rank{font-size:.9rem;color:var(--muted);text-align:right}
.rank b{color:var(--warn)}
.xpbar{height:6px;background:var(--steel2);border-radius:3px;margin-top:3px;min-width:120px}
.xpbar i{display:block;height:100%;background:var(--warn);border-radius:3px}
.tabs{max-width:1120px;margin:0 auto;padding:0 1rem;display:flex;gap:.3rem;overflow-x:auto}
.tab{background:var(--steel);border:1px solid var(--steel2);border-bottom:0;padding:.5rem .9rem;border-radius:5px 5px 0 0;white-space:nowrap;font-size:.95rem;min-height:40px}
.tab[aria-current="page"]{background:var(--paper);color:var(--pink);font-weight:700}
.tab.locked{opacity:.55}

/* title */
.title{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1rem;position:relative;overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(230,217,184,.28) 0,rgba(230,217,184,0) 14%),linear-gradient(180deg,rgba(17,26,43,.2),rgba(11,14,20,.95));pointer-events:none}
.title>*{position:relative}
.logo{width:150px;height:150px;border-radius:50%;box-shadow:0 0 50px rgba(120,150,200,.25)}
.title h1{margin-top:1rem;text-shadow:0 3px 30px #000}
.tag{font-family:var(--type);color:var(--paper);font-size:1.2rem}
.brief{max-width:34rem;margin:1.2rem auto;font-family:var(--type);color:#c8c1ab;text-align:left;border-left:3px solid var(--red);padding-left:1rem}
.brief p{opacity:0;animation:line .7s forwards}
.brief p:nth-child(1){animation-delay:.4s}.brief p:nth-child(2){animation-delay:1.6s}.brief p:nth-child(3){animation-delay:2.8s}.brief p:nth-child(4){animation-delay:4s}
@keyframes line{to{opacity:1}}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:var(--type);padding:.05rem .6rem;transform:rotate(-6deg);letter-spacing:.08em}

/* menu */
.menu{max-width:520px;margin:3rem auto;display:grid;gap:.7rem}
.menu .btn{text-align:left;font-family:var(--type);font-size:1.15rem;padding:1rem 1.2rem;background:var(--steel);border:1px solid var(--steel2)}
.menu .btn:hover{background:var(--steel2)}
.menu .btn.primary{background:var(--red);border-color:var(--red)}

/* paper */
.paper{background:var(--paper);color:var(--pink);font-family:var(--type);padding:1.2rem 1.4rem;border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);position:relative;line-height:1.5}
.paper h2,.paper h3{color:#1c150a}
.paper .muted{color:#6b5a37}
.paper p:last-child{margin-bottom:0}
.paper input[type=text],.paper textarea{background:#f3ead0;color:var(--pink)}
.badge{display:inline-block;font-family:var(--ui);font-size:.8rem;padding:.1rem .5rem;border-radius:3px;background:#2a2113;color:var(--paper);margin-right:.4rem}
.badge.real{background:#2c5a3d}.badge.game{background:#6b2b2f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.split{grid-template-columns:1.4fr 1fr}.split2{grid-template-columns:2fr 1fr;align-items:start}
@media(max-width:760px){.grid2,.split,.split2{grid-template-columns:1fr}.split2 .card[style*="sticky"]{position:static!important}}
.card{background:var(--steel);border:1px solid var(--steel2);border-radius:4px;padding:1rem}
.card h3{font-size:1.1rem}

/* exhibits */
.ex{display:block;width:100%;text-align:left;background:var(--paper2);color:var(--pink);border:0;border-radius:2px 14px 2px 2px;padding:.7rem .9rem .8rem;font-family:var(--type);box-shadow:0 4px 12px rgba(0,0,0,.45);position:relative;min-height:84px}
.ex small{display:block;font-family:var(--ui);color:#6b5a37;font-size:.82rem}
.ex.on{outline:3px solid var(--warn)}
.ex .tick{position:absolute;right:.5rem;top:.4rem;font-family:var(--ui);font-weight:700;font-size:.8rem;padding:.05rem .4rem;border-radius:3px;background:#2c5a3d;color:#fff}
.ex .tick.no{background:#7a2c31}
.photo{height:130px;background:linear-gradient(180deg,#1c2433,#0b0f17);border:6px solid #f2ecd9;position:relative;margin:.4rem 0}
.photo .orb{position:absolute;left:58%;top:34%;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.2) 55%,transparent 70%)}
.file-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem;margin-top:.7rem}
.opt{background:#f3ead0;border:2px solid #b5a174;color:var(--pink);text-align:left;padding:.5rem .7rem;border-radius:3px;font-family:var(--ui);min-height:44px}
.opt:hover{border-color:var(--red)}
.opt b{display:block;font-family:var(--type);font-weight:400}
.opt span{font-size:.85rem;color:#5b4c2d}
.fb{margin-top:.8rem;padding:.7rem .9rem;border-left:5px solid var(--warn);background:rgba(224,169,74,.14);font-family:var(--ui);color:inherit}
.fb.good{border-color:var(--ok);background:rgba(125,187,137,.15)}
.fb.bad{border-color:var(--red);background:rgba(192,48,58,.14)}
.paper .fb{color:var(--pink)}

/* progress */
.track{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.track li{display:flex;gap:.6rem;align-items:flex-start}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;margin-top:2px}
.track li.done .dot{background:var(--ok);border-color:var(--ok);color:#0b0e14;font-weight:700}

/* forms */
label{display:block;font-weight:700;margin-bottom:.3rem}
input[type=text],textarea{width:100%;font:inherit;padding:.6rem .7rem;border-radius:3px;border:2px solid var(--steel2);background:#0e1522;color:var(--text)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.count{font-size:.85rem;color:var(--muted);text-align:right}
.count.ok{color:var(--ok)}
.pick{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:2px solid var(--steel2);border-radius:3px;margin-bottom:.5rem;cursor:pointer;background:var(--steel)}
.pick:hover{border-color:var(--warn)}
.pick input{margin-top:.35rem;width:20px;height:20px;flex:none}
.pick.sel{border-color:var(--warn);background:var(--steel2)}
.paper .pick{background:#f3ead0;border-color:#b5a174}
.paper .pick.sel{border-color:var(--red)}

/* board */
.board{position:relative;background:#3b2c1c;background-image:radial-gradient(rgba(0,0,0,.28) 1px,transparent 1.5px);background-size:14px 14px;border:10px solid #231a10;border-radius:4px;padding:1.2rem;min-height:340px}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board .grid3{position:relative;z-index:1;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.4rem}
.pin{background:var(--paper);color:var(--pink);font-family:var(--type);border:0;text-align:left;padding:.9rem .7rem .6rem;box-shadow:0 5px 10px rgba(0,0,0,.5);position:relative;min-height:92px;transform:rotate(var(--r,0deg))}
.pin::before{content:"";position:absolute;left:50%;top:-6px;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 2px 3px rgba(0,0,0,.5);transform:translateX(-50%)}
.pin small{display:block;font-family:var(--ui);color:#6b5a37}
.pin.from{outline:3px solid var(--warn)}
.empty{padding:2rem;text-align:center;color:var(--muted)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(30px);background:#000;border:2px solid var(--warn);color:var(--text);padding:.6rem 1rem;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem}
.ach div{padding:.7rem;border:2px dashed var(--steel2);border-radius:4px;opacity:.55}
.ach div.on{opacity:1;border:2px solid var(--warn);background:rgba(224,169,74,.1)}
@media(prefers-reduced-motion:reduce){.brief p{animation:none;opacity:1}#toast{transition:none}}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='hf_save_v1';
var mem=null;

/* ---------- data ---------- */
var TYPES={
  fact:{n:'Verified fact',d:'Confirmed by records or something you could check yourself.'},
  claim:{n:'Documented claim',d:'Written down by someone, but only as reliable as its author.'},
  eye:{n:'Eyewitness account',d:'What a person says they saw or heard.'},
  lore:{n:'Folklore',d:'A story passed along, with an unclear source.'},
  spec:{n:'Speculation',d:'A guess or belief with no evidence behind it.'},
  mis:{n:'Possibly misleading',d:'Looks like evidence, but has an ordinary explanation.'}
};
var EV=[
 {id:'E1',title:'Landmark record',kind:'Public record',src:'real',type:'fact',
  body:'<p>Cincinnati Music Hall opened in 1878 in the Over-the-Rhine neighborhood. It is a National Historic Landmark.</p><p class="muted">Anyone can check these details against public records.</p>',
  why:'It is a basic, checkable fact about the building, confirmed by public records. It tells you nothing yet about ghosts. It only tells you the building is real, old, and well documented.'},
 {id:'E2',title:'Burial ground accounts',kind:'Historical accounts',src:'real',type:'claim',
  body:'<p>Several local-history accounts describe the block as city burial ground before the hall was built. Historians disagree about how many graves were moved.</p>',
  why:'This is documented, but disputed. People wrote it down, and historians still argue about the details, so treat it as a claim you would want to verify, not a settled fact.'},
 {id:'E3',title:'Statement: Dana R., usher',kind:'Witness statement',src:'game',type:'eye',
  body:'<p><b>Dana R.</b> (usher, three seasons):</p><p>"The show ended around 10:30. I was on the main stair landing. The house lights were already down. I saw a tall man in a gray coat standing at the balcony rail, right in the middle. I called out and he did not turn. When I got up there the balcony door was standing wide open and the balcony was empty. It was about 10:40."</p>',
  why:'This is what one person says she saw and heard. It matters, but it is a personal account, and the rest of the file will test it.'},
 {id:'E4',title:'Statement: Marcus T., stagehand',kind:'Witness statement',src:'game',type:'eye',
  body:'<p><b>Marcus T.</b> (stagehand, eight seasons):</p><p>"I locked the balcony door at 10:15, after the last guests left the upper level. I had the only key on me. At 10:30 I switched on the balcony work lights to sweep. I was up there until about 10:50. Around 10:55 I heard footsteps behind me, but when I turned there was nobody. No one was on that balcony while I was there."</p>',
  why:'Another personal account of what someone saw and heard. It conflicts with Dana in several places, which is exactly why it is worth examining.'},
 {id:'E5',title:'Maintenance log',kind:'Building record',src:'game',type:'claim',
  body:'<p>10:20 PM. HVAC cycle started on upper level.</p><p>Note from facilities: "Balcony door latch sticks. Reported twice this season. Door swings open when air pressure changes. Work order pending."</p>',
  why:'It is a written record, so it is documented, but it is only as reliable as the person who wrote it. It fits Marcus\'s account of a locked door and offers a possible reason the door was open.'},
 {id:'E6',title:'Floor plan: upper level',kind:'Architectural record',src:'game',type:'fact',
  body:'<svg viewBox="0 0 300 190" width="100%" role="img" aria-label="Floor plan. A column stands between the main stair landing and the middle of the balcony rail."><rect x="20" y="14" width="260" height="46" fill="none" stroke="#2a2113" stroke-width="2"/><text x="150" y="42" text-anchor="middle" font-size="12" fill="#2a2113">BALCONY</text><line x1="20" y1="60" x2="280" y2="60" stroke="#2a2113" stroke-width="4"/><text x="40" y="76" font-size="10" fill="#2a2113">rail</text><rect x="272" y="28" width="8" height="18" fill="#c0303a"/><text x="226" y="22" font-size="10" fill="#c0303a">door (latch)</text><circle cx="150" cy="104" r="9" fill="#2a2113"/><text x="166" y="108" font-size="10" fill="#2a2113">column</text><rect x="115" y="140" width="70" height="30" fill="none" stroke="#2a2113" stroke-width="2"/><text x="150" y="159" text-anchor="middle" font-size="10" fill="#2a2113">stair landing</text><line x1="150" y1="140" x2="150" y2="62" stroke="#c0303a" stroke-width="2" stroke-dasharray="5 4"/></svg><p class="muted">The dashed line is the view from the landing to the middle of the rail. The column blocks it.</p>',
  why:'A floor plan is a record you can measure and check. It is a verified fact in this case, and it raises a question about what Dana could really see from the landing.'},
 {id:'E7',title:'Ghost tour brochure',kind:'Lobby brochure',src:'game',type:'lore',
  body:'<p>"Meet <b>The Man in the Gray Coat</b>, who has roamed the balcony for over a century. Staff say he appears after every sold-out concert."</p><p class="muted">No author. No sources. No dates.</p>',
  why:'It is a story passed along with no named source and no evidence. A tour brochure is also selling something, which makes it more folklore than fact.'},
 {id:'E8',title:'Dana\'s blog post',kind:'Online post',src:'game',type:'spec',
  body:'<p>Posted two weeks after the incident:</p><p>"I always knew this place was haunted. I SAW him. Now everyone believes me and the tour guides keep asking for my story."</p>',
  why:'It is a belief stated as fact, and she says she always believed it before the incident. It was written after the event, and it shows she now gains attention from the story. That is a reason to read it carefully.'},
 {id:'E9',title:'Visitor photo, 10:42 PM',kind:'Photograph',src:'game',type:'mis',
  body:'<div class="photo" role="img" aria-label="Dark photo of a balcony with one bright round spot"><span class="orb"></span></div><p>Taken with flash from the main floor. A bright round spot hovers near the balcony rail. The visitor says it is "a spirit orb."</p>',
  why:'It looks like proof, but a flash can light up dust or moisture in the air and create a round bright spot. It has an ordinary explanation, so it cannot be treated as evidence of a spirit.'}
];
var EVMAP={};EV.forEach(function(e){EVMAP[e.id]=e});

var CONTRA=[
 {id:'a',t:'Whether anyone was on the balcony. Dana saw a man at the rail. Marcus says no one was there.',ok:true},
 {id:'b',t:'Whether the balcony door was locked. Dana found it wide open. Marcus says he locked it and had the only key.',ok:true},
 {id:'c',t:'How well lit the area was. Dana says the lights were down. Marcus says he switched the balcony work lights on.',ok:true},
 {id:'d',t:'Whether both of them work at Music Hall.',ok:false},
 {id:'e',t:'The time. Dana saw the figure at about 10:40. Marcus heard footsteps at about 10:55.',ok:false}
];
var THEORIES={

 psy:{n:'Psychological',d:'Dana expected a ghost and her mind filled in a figure in dim light from a partly blocked view.',sup:['E3','E6','E7','E8'],ch:'A psychological theory has to account for the open door, which Dana did not imagine (E3, E5).'},
 his:{n:'Historical',d:'The gray-coat legend grew out of real history, and it changes shape each time it is retold.',sup:['E1','E2','E7'],ch:'A historical theory explains where the legend came from, but not what happened on this particular night.'},

function rank(){var r=RANKS[0],nx=null;for(var i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null}}return {name:r[1],lo:r[0],hi:nx?nx[0]:r[0]+1,max:!nx}}

function stageDone(){return [
  S.readCase,
  nColl()>=6&&S.coll.E3&&S.coll.E4,
  S.contra.done,
  S.links.length>=2,
  S.th.done,
  S.filed,
  BEATS.every(function(b){return wc(S.story[b.k])>=15})
]}
function unlocked(s){
  var d=stageDone();
  if(s==='interview')return !!(S.coll.E3&&S.coll.E4);
  if(s==='theory')return d[1]&&d[2]&&d[3];
  if(s==='report')return d[4];
  if(s==='final')return d[5];
  return true;
}

intro:function(){return '<div class="wrap"><div class="paper" style="max-width:640px;margin:3rem auto"><span class="stamp">CASE #0047</span><h2 style="margin-top:.8rem">Welcome, Investigator</h2>'+
 '<p>You have been given access to the Haunting Files. Each case is a real location, a real history, and a mystery that needs answers.</p>'+
 '<p>Your first assignment is a training case. It uses the real Cincinnati Music Hall, but the witness statements and most documents were written for this game. Each exhibit is labeled so you always know which is which.</p>'+
 '<label for="nm">Enter your investigator name</label><input id="nm" type="text" maxlength="24" data-bind="name" value="'+esc(S.name)+'" autocomplete="off">'+
 '<p style="margin-top:1rem"><button class="btn" data-act="begin">Begin the case</button></p></div></div>'},

case:function(){
 var d=stageDone(),ev=S.sel?EVMAP[S.sel]:null;
 var cards=EV.map(function(e){
   var c=S.cls[e.id],tick=c?'<span class="tick'+(c===e.type?'':' no')+'">'+(c===e.type?'Filed':'Review')+'</span>':'';
   return '<button class="ex'+(S.sel===e.id?' on':'')+'" data-ex="'+e.id+'">'+tick+'<b>'+e.id+'</b> '+esc(e.title)+'<small>'+esc(e.kind)+'</small></button>'}).join('');
 return nav()+'<div class="wrap"><div class="grid2 split">'+
 '<div><div class="paper"><span class="stamp">TRAINING CASE</span><h2 style="margin-top:.7rem">Case File #0047: Cincinnati Music Hall</h2>'+
 '<p><b>Location:</b> Cincinnati Music Hall, Over-the-Rhine.<br><b>Reported event:</b> After a Saturday concert, an usher reports a figure in a gray coat on the upper balcony. A stagehand says nobody was there. The balcony door was found open.</p>'+
 '<p><b>Your assignment:</b> Open each exhibit. Decide what kind of evidence it is and file it. Then find where the witnesses disagree, connect the clues, and decide what you can defend.</p>'+
 '<p class="muted">Real history and game material are labeled on every exhibit. Do not treat game material as documented history.</p>'+
 (S.readCase?'':'<button class="btn" data-act="readcase">I have read the file</button>')+'</div>'+
 '<h3 style="margin:1.2rem 0 .6rem">Exhibits</h3><div class="grid3">'+cards+'</div></div>'+
 '<div><div class="card"><h3>Case progress</h3><ol class="track">'+STAGES.map(function(s,i){return '<li class="'+(d[i]?'done':'')+'"><span class="dot">'+(d[i]?'&#10003;':'')+'</span><span>'+s+'</span></li>'}).join('')+'</ol></div></div></div>'+
 '<div id="viewer" style="margin-top:1.2rem">'+(ev?viewer(ev):'<div class="empty">Select an exhibit to examine it.</div>')+'</div></div>'
},

board:function(){
 var ids=Object.keys(S.coll);
 var cards=ids.map(function(id,i){var e=EVMAP[id];var r=((i*37)%7-3)*.6;
   return '<button class="pin'+(T.linkFrom===id?' from':'')+'" style="--r:'+r+'deg" data-pin="'+id+'"><b>'+id+'</b> '+esc(e.title)+'<small>'+TYPES[S.cls[id]].n+'</small></button>'}).join('');
 var pend='';
 if(T.pending){pend='<div class="card" style="margin-top:1rem"><h3>Connect '+T.pending.a+' and '+T.pending.b+'</h3><p class="muted">Tell the board why. A connection with no reason is just string.</p>'+
   '<div class="row" style="margin-bottom:.6rem">'+['supports','contradicts','explains'].map(function(k,i){return '<label style="display:inline-flex;gap:.4rem;margin:0"><input type="radio" name="lk" value="'+k+'"'+(i===0?' checked':'')+'>'+k+'</label>'}).join('')+'</div>'+
   '<input type="text" id="lkwhy" maxlength="160" placeholder="Why are these connected? (at least 6 words)"><p style="margin-top:.7rem"><button class="btn sm" data-act="addlink">Add string</button> <button class="btn ghost sm" data-act="cancellink">Cancel</button></p></div>'}
 var links=S.links.map(function(l,i){return '<li><b>'+l.a+' '+l.k+' '+l.b+'.</b> '+esc(l.why)+' <button class="btn ghost sm" data-act="dellink" data-i="'+i+'">Remove</button></li>'}).join('');
 return nav()+'<div class="wrap"><h2>Evidence board</h2><p class="muted">Tap one exhibit, then another, to connect them with red string. Contradictions and support both count.</p>'+
 (ids.length?'<div class="board" id="board"><svg id="strings" aria-hidden="true"></svg><div class="grid3">'+cards+'</div></div>':'<div class="empty card">Your board is empty. File exhibits from the Case file to pin them here.</div>')+
 (T.linkFrom&&!T.pending?'<p class="fb">Connecting from <b>'+T.linkFrom+'</b>. Tap another exhibit, or tap it again to cancel.</p>':'')+pend+
 '<h3 style="margin-top:1.2rem">Connections ('+S.links.length+')</h3>'+(links?'<ul style="padding-left:1.1rem">'+links+'</ul>':'<p class="muted">None yet. Make at least 2 to unlock the Theory.</p>')+'</div>'
},

interview:function(){
 var c=S.contra;
 var picks=CONTRA.map(function(o){var on=c.pick.indexOf(o.id)>-1;
   var res=c.done?(o.ok?(on?'<b> Correct.</b>':'<b> You missed this one.</b>'):(on?'<b> Not a real contradiction.</b>':'')):'';
   return '<label class="pick'+(on?' sel':'')+'"><input type="checkbox" data-pick="'+o.id+'"'+(on?' checked':'')+(c.done?' disabled':'')+'><span>'+esc(o.t)+res+'</span></label>'}).join('');
 var fb='';
 if(c.done){var latch=/latch|maintenance|\blog\b|hvac|air pressure|draft/i.test(c.text);
   fb='<div class="fb '+(c.score===3?'good':'')+'"><b>You found '+c.score+' of 3 real contradictions.</b> The time difference (10:40 and 10:55) describes two different moments, so it is not a conflict. Both witnesses working at the hall does not conflict either.'+
   (latch?' You noticed the maintenance record about the latch. A door can swing open when air pressure changes, with no one opening it.':' Look again at E5. The maintenance log says the balcony latch sticks and the door swings open when air pressure changes.')+'</div>'}
 return nav()+'<div class="wrap"><h2>Interview room</h2><p class="muted">Compare the two statements line by line. Select only the places where they truly conflict.</p>'+
 '<div class="grid2"><div class="paper">'+EVMAP.E3.body+'</div><div class="paper">'+EVMAP.E4.body+'</div></div>'+
 '<h3 style="margin:1.2rem 0 .5rem">Where do they truly conflict? (Choose all that apply.)</h3>'+picks+
 '<h3 style="margin:1rem 0 .4rem">Whose account would you trust more about the open door, and why?</h3><p class="muted">Use evidence from the file. Aim for 20 words or more.</p>'+
 '<textarea data-bind="contra.text" aria-label="Your reasoning">'+esc(c.text)+'</textarea>'+count('contra.text',20)+
 (c.done?'':'<p style="margin-top:.6rem"><button class="btn" data-act="submitcontra">Submit findings</button></p>')+fb+'</div>'
},

theory:function(){
 var t=S.th,ids=Object.keys(S.coll);
 var th=Object.keys(THEORIES).map(function(k){var o=THEORIES[k];
   return '<label class="pick'+(t.choice===k?' sel':'')+'"><input type="radio" name="th" data-th="'+k+'"'+(t.choice===k?' checked':'')+'><span><b>'+o.n+'.</b> '+esc(o.d)+'</span></label>'}).join('');
 var cites=ids.map(function(id){var e=EVMAP[id],on=t.cites.indexOf(id)>-1;
   return '<label class="pick'+(on?' sel':'')+'"><input type="checkbox" data-cite="'+id+'"'+(on?' checked':'')+'><span><b>'+id+'</b> '+esc(e.title)+' <span class="muted">('+TYPES[S.cls[id]].n+')</span></span></label>'}).join('');
 return nav()+'<div class="wrap"><h2>Theory</h2><p class="muted">The goal is not to pick the scariest answer. It is to pick the one you can defend with the best evidence.</p>'+
 '<h3>Which explanation do you defend?</h3>'+th+
 '<h3 style="margin-top:1rem">Which exhibits support it? (Choose at least 2.)</h3>'+cites+
 '<h3 style="margin-top:1rem">Make your case</h3><textarea data-bind="th.why" aria-label="Your argument">'+esc(t.why)+'</textarea>'+count('th.why',30)+
 '<h3 style="margin-top:1rem">What new evidence would change your mind?</h3><textarea style="min-height:80px" data-bind="th.change" aria-label="What would change your mind">'+esc(t.change)+'</textarea>'+count('th.change',8)+
 '<p style="margin-top:.7rem"><button class="btn" data-act="submittheory">'+(t.done?'Update my theory':'Submit theory')+'</button></p>'+(T.fbTheory||'')+'</div>'
},

report:function(){
 return nav()+'<div class="wrap"><h2>Field report</h2><div class="paper" style="margin-bottom:1rem"><span class="stamp">FORM 7</span><p style="margin-top:.6rem"><b>Assignment:</b> Write the opening of your field report (80 words or more). Put the reader on the balcony at 10:40 PM and describe what the witnesses would have experienced. Then state what you believe happened and cite at least two exhibits by number, like E5 or E6.</p></div>'+
 '<textarea style="min-height:220px" data-bind="report" aria-label="Field report">'+esc(S.report)+'</textarea>'+count('report',80)+
 '<p style="margin-top:.6rem" class="row"><button class="btn" data-act="checkreport">Check my report</button>'+(S.filed?'<span class="muted">Filed. You can keep improving it.</span>':'')+'</p>'+(T.fbReport||'')+'</div>'
},

final:function(){
 var done=BEATS.filter(function(b){return wc(S.story[b.k])>=15}).length;
 var beats=BEATS.map(function(b,i){var p='story.'+b.k;
   return '<div class="card" style="margin-bottom:.8rem"><h3>'+(i+1)+'. '+b.n+'</h3><p class="muted">'+esc(b.p)+'</p><textarea style="min-height:110px" data-bind="'+p+'" aria-label="'+b.n+'">'+esc(S.story[b.k]||'')+'</textarea>'+count(p,15)+'</div>'}).join('');
 var inspo=Object.keys(S.coll).map(function(id){return '<li><b>'+id+'</b> '+esc(EVMAP[id].title)+'</li>'}).join('');
 return nav()+'<div class="wrap"><h2>Final story: write your own ghost story</h2><p>Use what you learned about evidence, doubt, and atmosphere. Draw inspiration from the case, but invent your own place, characters, and mystery. Do not retell the Music Hall legend.</p>'+
 '<div class="grid2 split2"><div>'+beats+'</div><div class="card" style="position:sticky;top:7rem"><h3>Your progress</h3><p><b>'+done+' of 9</b> beats complete.</p><h3>Evidence you collected</h3><ul style="padding-left:1.1rem">'+inspo+'</ul>'+
 '<button class="btn" data-act="export-story"'+(done<1?' disabled':'')+'>Download my story (.txt)</button></div></div></div>'
},

profile:function(){
 var r=rank(),ds=stageDone();
 return nav()+'<div class="wrap"><h2>Investigator '+esc(S.name||'')+'</h2><div class="grid2"><div class="card"><h3>'+esc(r.name)+'</h3><p>'+S.xp+' XP'+(r.max?'':' &middot; next rank at '+r.hi+' XP')+'</p>'+
 '<p class="muted">XP rewards good reasoning and strong writing, not speed or lucky guesses.</p><p>Exhibits filed: <b>'+nColl()+'</b> of 9<br>Filed correctly: <b>'+nCorrect()+'</b><br>Connections: <b>'+S.links.length+'</b><br>Case steps done: <b>'+ds.filter(Boolean).length+'</b> of 7</p></div>'+
 '<div class="card"><h3>Achievements</h3><div class="ach">'+ACH.map(function(a){return '<div class="'+(S.ach[a.id]?'on':'')+'"><b>'+a.n+'</b><br><span class="muted">'+a.d+'</span></div>'}).join('')+'</div></div></div></div>'
},

settings:function(){return (S.started?nav():'')+'<div class="wrap" style="max-width:640px"><h2>Save and settings</h2>'+
 '<div class="card"><p>Your progress saves automatically in this browser on this device. To move to another device, export a save file and import it there.</p>'+
 '<div class="row"><button class="btn" data-act="export">Export save file</button><label class="btn ghost" style="margin:0;display:inline-block">Import save file<input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div>'+
 '<p class="muted" style="margin-top:.8rem">Clearing browser data erases your progress unless you exported a file.</p></div>'+
 '<div class="card" style="margin-top:1rem"><label style="display:flex;gap:.6rem;align-items:center"><input type="checkbox" data-act="sound"'+(S.sound?' checked':'')+' style="width:20px;height:20px">Sound effects</label></div>'+
 '<div class="card" style="margin-top:1rem"><p>Start over and erase this case?</p><button class="btn ghost" data-act="reset">Erase my progress</button></div>'+
 '<p style="margin-top:1rem"><button class="btn ghost" data-act="menu">Back to menu</button></p></div>'}
};

function viewer(e){
 var c=S.cls[e.id],h='<div class="paper"><span class="badge '+e.src+'">'+(e.src==='real'?'Real history. Verify before citing.':'Game material written for this training case')+'</span><span class="badge">'+e.id+'</span>'+
  '<h2 style="margin-top:.6rem">'+esc(e.title)+'</h2>'+e.body;
 if(!c){h+='<h3 style="margin-top:1rem">How would you file this exhibit?</h3><div class="file-opts">'+Object.keys(TYPES).map(function(k){return '<button class="opt" data-file="'+k+'"><b>'+TYPES[k].n+'</b><span>'+TYPES[k].d+'</span></button>'}).join('')+'</div>'}
 else{var ok=c===e.type;h+='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'Filed correctly as '+TYPES[c].n+'.':'You filed this as '+TYPES[c].n+'. It is better filed as '+TYPES[e.type].n+'.')+'</b> '+esc(e.why)+'</div><p class="muted" style="margin-top:.6rem">Pinned to your evidence board.</p>'}
 return h+'</div>'
}

/* ---------- render + events ---------- */
function render(){
 var f=SCREENS[S.screen]||SCREENS.title;
 document.getElementById('app').innerHTML=f();
 if(S.screen==='board')setTimeout(drawLines,0);
}
function drawLines(){
 var b=document.getElementById('board'),svg=document.getElementById('strings');if(!b||!svg)return;
 var br=svg.getBoundingClientRect(),h='';
 function ctr(id){var el=b.querySelector('[data-pin="'+id+'"]');if(!el)return null;var r=el.getBoundingClientRect();return {x:r.left-br.left+r.width/2,y:r.top-br.top+6}}
 S.links.forEach(function(l){var a=ctr(l.a),c=ctr(l.b);if(!a||!c)return;
  var col=l.k==='contradicts'?'#ff5a5f':(l.k==='explains'?'#e0a94a':'#f2e6c2');
  h+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+c.x+'" y2="'+c.y+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"'+(l.k==='explains'?' stroke-dasharray="8 6"':'')+'/>'});
 svg.setAttribute('viewBox','0 0 '+br.width+' '+br.height);svg.innerHTML=h;
}
window.addEventListener('resize',function(){if(S.screen==='board')drawLines()});

function fileEx(k){
 var e=EVMAP[S.sel];if(!e||S.cls[e.id])return;
 S.cls[e.id]=k;S.coll[e.id]=true;
 var ok=k===e.type;
 xp(ok?12:5,ok?'Correct filing':'Good attempt. Read why.');blip(ok?660:240,.25,ok?'sine':'square');
 award('first');if(nCorrect()>=4)award('checker');
 save();render();
}
function analyze(t){
 var low=t.toLowerCase();
 var senses=['dim','dark','shadow','glow','gleam','pale','gray','flicker','creak','echo','hum','whisper','hiss','footstep','rustle','silence','cold','chill','draft','damp','dust','musty','smell','stale','velvet','brass','splinter','shiver','taste'];
 var sh={};senses.forEach(function(w){if(low.indexOf(w)>-1)sh[w]=1});
 var weak=(low.match(/\b(very|really|suddenly|just|thing|stuff|nice|scary)\b/g)||[]).length;
 var cites={};(t.match(/\bE[1-9]\b/g)||[]).forEach(function(c){cites[c]=1});
 return [
  {ok:wc(t)>=80,l:'At least 80 words',tip:'Add more detail about what the witnesses experienced.'},
  {ok:Object.keys(cites).length>=2,l:'Cites two or more exhibits by number',tip:'Name specific exhibits, like E5 or E6, to back up what you say.'},
  {ok:Object.keys(sh).length>=3,l:'Uses three or more sensory details',tip:'Add what the balcony sounded, felt, or smelled like, not only how it looked.'},
  {ok:weak<=2,l:'Avoids vague filler words',tip:'Swap words like "very", "really", "suddenly", and "scary" for a specific detail.'},
  {ok:/\b\d{1,2}:\d{2}\b/.test(t),l:'Includes a time stamp',tip:'Investigators log times. Mention 10:40 or another time from the file.'},
  {ok:/\b(may|might|appears|possible|possibly|likely|suggests|probably|could)\b/i.test(t),l:'Shows appropriate doubt',tip:'Good investigators say what the evidence suggests, not what they wish were true.'}
 ];
}
function submitTheory(){
 var t=S.th;
 if(!t.choice){toast('Choose an explanation first.');return}
 if(t.cites.length<2){toast('Cite at least 2 exhibits.');return}
 if(wc(t.why)<30){toast('Make your case in at least 30 words.');return}
 if(wc(t.change)<8){toast('Tell us what would change your mind (8 words or more).');return}
 var th=THEORIES[t.choice],mine=t.cites.filter(function(id){return th.sup.indexOf(id)>-1});
 var strong=t.cites.filter(function(id){var ty=EVMAP[id].type;return ty==='fact'||ty==='claim'});
 var weakc=t.cites.filter(function(id){var ty=EVMAP[id].type;return ty==='lore'||ty==='spec'||ty==='mis'});
 var counter=/\b(but|however|although|unless|even though|yet|on the other hand)\b/i.test(t.why);
 var n=25+Math.min(mine.length,3)*10+(counter?15:0)+(strong.length?10:0);
 var m='<div class="fb"><b>Your '+th.n+' theory.</b> ';
 m+=mine.length?'You cited '+mine.length+' exhibit'+(mine.length>1?'s':'')+' that directly support it ('+mine.join(', ')+'). ':'None of the exhibits you cited are the strongest support for this theory. Reread the file and look again. ';
 if(weakc.length)m+=weakc.join(', ')+' '+(weakc.length>1?'are':'is')+' folklore, speculation, or possibly misleading, so use '+(weakc.length>1?'them':'it')+' for atmosphere, not proof. ';
 if(!strong.length)m+='Try to include at least one verified fact or documented claim. ';
 m+=counter?'You acknowledged a counterpoint, which is what strong reasoning does. ':'You never mention a counterpoint. What would someone who disagrees say? ';
 m+='<br><br><b>The hardest question for your theory:</b> '+th.ch+'</div>';
 T.fbTheory=m;
 if(!t.done){t.done=true;xp(n,'Reasoned theory')}else toast('Theory updated.');
 if(strong.length)award('evid');
 save();render();
}

document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act],[data-go],[data-ex],[data-file],[data-pin]');if(!el)return;
 if(el.tagName==='INPUT'&&el.type==='checkbox'&&el.dataset.act==='sound'){S.sound=el.checked;save();return}
 var a=el.dataset.act;
 if(el.dataset.go){ev.preventDefault();go(el.dataset.go);return}
 if(el.dataset.ex){S.sel=el.dataset.ex;save();render();var v=document.getElementById('viewer');if(v)v.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(el.dataset.file){fileEx(el.dataset.file);return}
 if(el.dataset.pin){
  var id=el.dataset.pin;
  if(!T.linkFrom){T.linkFrom=id}
  else if(T.linkFrom===id){T.linkFrom=null}
  else{T.pending={a:T.linkFrom,b:id};T.linkFrom=null}
  render();return}
 if(!a)return;
 ev.preventDefault();
 if(a==='menu'){S.screen='menu';save();render();window.scrollTo(0,0)}
 else if(a==='resume'){S.screen='case';save();render()}
 else if(a==='newgame'){if(S.started&&!confirm('Start a new case? This erases your current progress unless you exported it.'))return;var snd=S.sound;S=fresh();S.sound=snd;S.screen='intro';save();render()}
 else if(a==='begin'){if((S.name||'').trim().length<2){toast('Enter your investigator name.');return}S.started=true;S.screen='case';save();render();window.scrollTo(0,0)}
 else if(a==='readcase'){S.readCase=true;save();render();toast('Case file read. Open the exhibits.')}
 else if(a==='addlink'){
  var why=(document.getElementById('lkwhy').value||'').trim();
  if(wc(why)<6){toast('Explain the connection in at least 6 words.');return}
  var k=(document.querySelector('input[name=lk]:checked')||{}).value||'supports';
  S.links.push({a:T.pending.a,b:T.pending.b,k:k,why:why});T.pending=null;
  xp(8,'Connection made');if(S.links.length>=2)award('string');save();render()}
 else if(a==='cancellink'){T.pending=null;render()}
 else if(a==='dellink'){S.links.splice(+el.dataset.i,1);save();render()}
 else if(a==='submitcontra'){
  if(wc(S.contra.text)<20){toast('Explain your reasoning in at least 20 words.');return}
  var pk=S.contra.pick,right=CONTRA.filter(function(o){return o.ok&&pk.indexOf(o.id)>-1}).length,wrong=CONTRA.filter(function(o){return !o.ok&&pk.indexOf(o.id)>-1}).length;
  var sc=Math.max(0,right-wrong);S.contra.score=sc;S.contra.done=true;
  var latch=/latch|maintenance|\blog\b|hvac|air pressure|draft/i.test(S.contra.text);
  xp(sc*8+10+(latch?8:0),'Interview analysis');if(sc===3)award('hound');save();render()}
 else if(a==='submittheory'){submitTheory()}
 else if(a==='checkreport'){
  var res=analyze(S.report||''),pass=res.filter(function(r){return r.ok}).length;
  T.fbReport='<div class="card" style="margin-top:1rem"><h3>Report review: '+pass+' of 6</h3><ul style="padding-left:1.1rem">'+res.map(function(r){return '<li>'+(r.ok?'<b style="color:var(--ok)">Pass.</b> ':'<b style="color:var(--warn)">Fix.</b> ')+r.l+(r.ok?'':'<br><span class="muted">'+r.tip+'</span>')+'</li>'}).join('')+'</ul>'+
   (pass>=4?'':'<p class="muted">Get at least 4 of 6 to file the report.</p>')+'</div>';
  if(pass>=4&&!S.filed){S.filed=true;xp(pass*10,'Field report filed');award('closed')}
  else if(pass>=4)toast('Report still passes.');
  save();render()}
 else if(a==='export'){download('haunting-files-save-'+(S.name||'investigator').replace(/\W+/g,'-')+'.json',JSON.stringify(S),'application/json')}
 else if(a==='export-story'){
  var txt='The Haunting Files: story by '+(S.name||'Investigator')+'\n\n'+BEATS.map(function(b){return (S.story[b.k]||'').trim()}).filter(Boolean).join('\n\n');
  download('my-ghost-story.txt',txt,'text/plain')}
 else if(a==='reset'){if(confirm('Erase all progress? This cannot be undone.')){S=fresh();S.screen='menu';save();render()}}
});
document.addEventListener('input',function(ev){
 var el=ev.target;
 if(el.dataset&&el.dataset.bind){
  setP(el.dataset.bind,el.value);save();
  var c=document.querySelector('[data-count="'+el.dataset.bind+'"]');
  if(c){var n=wc(el.value),m=+c.dataset.min;c.textContent=n+' / '+m+' words';c.classList.toggle('ok',n>=m)}
  if(el.dataset.bind.indexOf('story.')===0&&BEATS.every(function(b){return wc(S.story[b.k])>=15})){award('author');save()}
 }
});
document.addEventListener('change',function(ev){
 var el=ev.target;
 if(el.dataset.pick){var p=S.contra.pick,i=p.indexOf(el.dataset.pick);if(el.checked&&i<0)p.push(el.dataset.pick);if(!el.checked&&i>-1)p.splice(i,1);save();render()}
 else if(el.dataset.th){S.th.choice=el.dataset.th;save();render()}
 else if(el.dataset.cite){var c=S.th.cites,j=c.indexOf(el.dataset.cite);if(el.checked&&j<0)c.push(el.dataset.cite);if(!el.checked&&j>-1)c.splice(j,1);save();render()}
 else if(el.id==='imp'&&el.files&&el.files[0]){
  var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||o.v!==1||typeof o.xp!=='number')throw 0;S=o;S.screen='menu';save();render();toast('Save file imported.')}catch(e){toast('That file is not a Haunting Files save.')}};fr.readAsText(el.files[0])}
});
function download(name,text,type){
 try{var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500)}catch(e){toast('Download failed on this browser.')}
}
if(S.screen==='intro'&&!S.started){}
render();
})();
</script>
</body>
