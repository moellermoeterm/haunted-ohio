<!doctype html>
<html lang="en" data-theme="dark" data-game="last-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Light | MoeTerm Haunted Ohio</title>
<link rel="icon" type="image/png" href="../assets/img/ho-icon.png">
<link rel="stylesheet" href="../assets/css/ho-fonts.css">
<link rel="stylesheet" href="../assets/css/ho-core.css">
<style>
:root{
  --bg:var(--ho-night);--panel:var(--ho-surface);--panel2:var(--ho-surface-2);--line:var(--ho-line);--steel:#7b8a8c;
  --moss:var(--ho-spectral);--amber:var(--ho-gold);--sig:var(--ho-ember);--text:var(--ho-text);--muted:var(--ho-muted);--bad:#e0594a;
  --disp:var(--ho-cond);--ui:var(--ho-body);--mono:var(--ho-mono);
}
*{box-sizing:border-box}
html{scroll-padding-top:7rem}
body{margin:0;background:linear-gradient(180deg,#171c15 0,var(--bg) 340px) fixed;color:var(--text);font-family:var(--ui);font-size:1.05rem;line-height:1.55;min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:.02em;line-height:1.05;margin:0 0 .6rem}
h1{font-size:clamp(3rem,11vw,6.5rem)}h2{font-size:2rem}h3{font-size:1.4rem}
p{margin:0 0 .8rem}
a{color:var(--amber)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:1rem}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.btn{background:var(--sig);color:#1a0f05;border:0;padding:.7rem 1.3rem;border-radius:2px;font-family:var(--disp);font-size:1.2rem;font-weight:700;letter-spacing:.04em;min-height:46px}
.btn:hover{background:#ff9140}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--steel)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:1rem;padding:.4rem .8rem;min-height:38px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:1rem 1.1rem}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:1rem;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
@media(max-width:760px){.split,.grid2{grid-template-columns:1fr}}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:rgba(13,15,12,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hud-in{max-width:1280px;margin:0 auto;padding:.45rem 1rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:.5rem;align-items:center;font-family:var(--disp);font-size:1.4rem;color:var(--text);text-decoration:none;margin-right:auto}
.brand img{width:34px;height:34px;border-radius:50%}
.meters{display:flex;gap:.4rem;flex-wrap:wrap}
.m{background:var(--panel2);border:1px solid var(--line);padding:.1rem .55rem;border-radius:2px;font-size:.9rem;white-space:nowrap}
.m b{font-family:var(--mono);color:var(--amber);font-weight:400}
.m.low b{color:var(--bad)}
.tabs{max-width:1280px;margin:0 auto;padding:0 1rem;display:flex;gap:.3rem;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:.5rem .9rem;font-family:var(--disp);font-size:1.15rem;min-height:42px;white-space:nowrap;color:var(--muted)}
.tab[aria-current="page"]{color:var(--sig);border-color:var(--sig)}
.tab.locked{opacity:.5}

/* title */
.title{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 1.2rem 3rem;position:relative;overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(13,15,12,.1) 0,rgba(13,15,12,.92) 85%),
  radial-gradient(ellipse at 70% 30%,rgba(255,122,26,.45),rgba(255,122,26,0) 55%),
  linear-gradient(180deg,#2a2218 0,#0d0f0c 100%)}
.skyline{position:absolute;left:0;right:0;bottom:30%;height:34%;opacity:.55}
.title>*{position:relative}
.title .logo{width:84px;height:84px;border-radius:50%;margin-bottom:1rem}
.title h1{color:#f3eadb;text-shadow:0 0 40px rgba(255,122,26,.35);margin-bottom:.2rem}
.tag{font-family:var(--mono);color:var(--sig);font-size:1.05rem;max-width:30rem}
.signal-line{width:min(460px,90%);height:3px;background:var(--sig);margin:1rem 0;transform-origin:left;animation:sweep 3.2s ease-in-out infinite;box-shadow:0 0 14px var(--sig)}
@keyframes sweep{0%,100%{transform:scaleX(.15);opacity:.5}50%{transform:scaleX(1);opacity:1}}

.menu{max-width:520px;margin:3rem auto;display:grid;gap:.7rem}
.menu .btn{text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);font-size:1.45rem;padding:.9rem 1.2rem}
.menu .btn:hover{border-color:var(--sig);color:var(--sig)}
.menu .btn.primary{background:var(--sig);color:#1a0f05;border-color:var(--sig)}

/* forms */
label{display:block;font-weight:700;margin-bottom:.3rem}
input[type=text],textarea,select{width:100%;font:inherit;padding:.6rem .7rem;border-radius:2px;border:2px solid var(--line);background:#0a0c09;color:var(--text)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.count{font-size:.85rem;color:var(--muted);text-align:right;font-family:var(--mono)}
.count.ok{color:var(--moss)}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);padding:.7rem .9rem;margin-bottom:.5rem;border-radius:2px;min-height:46px}
.choice:hover{border-color:var(--sig)}
.choice small{display:block;color:var(--muted);font-size:.85rem}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.pick{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .8rem;border:2px solid var(--line);border-radius:2px;margin-bottom:.5rem;cursor:pointer;background:var(--panel2)}
.pick:hover{border-color:var(--amber)}
.pick input{margin-top:.35rem;width:20px;height:20px;flex:none}
.pick.sel{border-color:var(--amber)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem}
.opt{background:var(--panel2);border:2px solid var(--line);padding:.6rem .8rem;border-radius:2px;text-align:left;min-height:46px}
.opt.on{border-color:var(--sig);background:#2a2013}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.fb{margin:.8rem 0;padding:.7rem .9rem;border-left:5px solid var(--amber);background:rgba(227,168,58,.1)}
.fb.good{border-color:var(--moss);background:rgba(138,164,118,.12)}
.fb.bad{border-color:var(--bad);background:rgba(224,89,74,.1)}

/* radio */
.radio{background:#0a0c09;border:2px solid var(--line);border-radius:4px;padding:1rem;font-family:var(--mono)}
.freq{font-size:2.6rem;color:var(--sig);text-shadow:0 0 14px rgba(255,122,26,.5);line-height:1}
.meter{height:14px;background:#1b2119;border:1px solid var(--line);margin:.5rem 0}
.meter i{display:block;height:100%;background:var(--sig);transition:width .1s}
.sigtxt{min-height:3.4em;color:var(--moss);letter-spacing:.04em;margin-top:.5rem;word-break:break-word}
input[type=range]{width:100%;height:44px;accent-color:var(--sig)}
.tx{background:#0a0c09;border-left:4px solid var(--sig);padding:.8rem 1rem;font-family:var(--mono);color:#cfe0c4;margin:.7rem 0}
.tx p{margin:0 0 .4rem}

/* map */
.mapbox{position:relative;max-width:560px;margin:0 auto;aspect-ratio:400/420;background:#0a0d0a;border:1px solid var(--line)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid var(--moss);background:#10150f;display:grid;place-items:center;font-family:var(--disp);font-size:1.2rem;padding:0}
.mk.here{border-color:var(--amber)}
.mk.todo{border-color:var(--sig);animation:pulse 2s infinite}
.mk.lock{border-color:#3a4338;color:#59635a}
.mk.sel{background:var(--sig);color:#1a0f05}
.mk-l{position:absolute;transform:translate(-50%,0);font-size:.72rem;color:var(--muted);white-space:nowrap;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.5)}50%{box-shadow:0 0 0 10px rgba(255,122,26,0)}}
.bar{height:10px;background:#1b2119;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--moss)}.bar.low i{background:var(--bad)}
.item{display:flex;justify-content:space-between;gap:1rem}
.entry{border-left:3px solid var(--line);padding-left:.8rem;margin-bottom:1rem}
.entry h3{margin-bottom:.2rem}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(30px);background:#000;border:2px solid var(--sig);padding:.6rem 1rem;border-radius:3px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.ach div{padding:.7rem;border:2px dashed var(--line);border-radius:3px;opacity:.55}
.ach div.on{opacity:1;border:2px solid var(--amber)}
@media(prefers-reduced-motion:reduce){.signal-line,.mk.todo{animation:none}#toast,.meter i{transition:none}}

.how-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;padding:1rem}
.how{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;max-width:42rem;width:100%;max-height:min(88vh,46rem);overflow:auto;padding:1.2rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.how h2{margin-bottom:.4rem}.how h2:focus{outline:none}.how h3{margin-top:1rem}
.how ol,.how ul{padding-left:1.3rem;margin:.4rem 0}.how li{margin:.5rem 0}

/* ===== P5: Haunted Ohio design-system skin (look only) ===== */
body{background:radial-gradient(1000px 600px at 82% -10%,rgba(255,122,26,.14) 0,transparent 62%),radial-gradient(900px 600px at 0% 105%,rgba(138,164,118,.10) 0,transparent 60%),linear-gradient(180deg,#161b14 0,var(--bg) 360px) fixed;animation:ho-fade .5s var(--ho-ease) both}
body::before{content:"";position:fixed;inset:0;background-image:var(--ho-grain);opacity:.05;mix-blend-mode:overlay;pointer-events:none;z-index:1}
:focus-visible{outline:3px solid var(--ho-focus);outline-offset:2px;border-radius:3px}
.btn{border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.3),0 8px 20px rgba(255,122,26,.16);transition:transform .15s var(--ho-ease),background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{box-shadow:none}

/* shared bureau bar */
.ho-bureau{position:relative;z-index:30;font-family:var(--ho-body)}
.ho-bureau>span:not(.ho-bureau__sp){color:var(--ho-muted)}

/* HUD: radio-dial readouts */
.hud{background:rgba(8,10,7,.93);border-bottom:1px solid var(--line)}
.brand{letter-spacing:.03em}
.brand img{box-shadow:0 0 0 1px var(--ho-gold-dim),0 0 14px rgba(255,122,26,.25)}
.m{border-radius:99px;padding:.15rem .75rem;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.m.low{border-color:var(--bad);box-shadow:0 0 12px rgba(224,89,74,.25)}
.tab{border-radius:8px 8px 0 0;transition:color .2s,background .2s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab[aria-current="page"]{background:rgba(255,122,26,.08)}

/* panels */
.panel{border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel) 42%);box-shadow:var(--ho-shadow)}
.choice{border-radius:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));transition:transform .15s var(--ho-ease),border-color .2s}
.choice:hover{transform:translateX(3px)}
.opt{border-radius:10px}
.pick{border-radius:10px}
.fb{border-radius:0 10px 10px 0}
input[type=text],textarea,select{border-radius:10px;background:#090b08}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--ho-spectral);box-shadow:0 0 0 3px rgba(138,164,118,.25)}
.bar{height:12px;border-radius:99px;overflow:hidden}
.bar i{border-radius:99px;background:linear-gradient(90deg,#5e7a50,var(--moss))}
.entry{border-left-color:var(--ho-gold-dim)}

/* title */
.title{min-height:calc(100vh - 44px)}
.title>.skyline{position:absolute;left:0;right:0;bottom:30%;width:100%;height:34%;opacity:.5;pointer-events:none}
.title .logo{box-shadow:0 0 0 2px var(--ho-gold-dim),0 0 50px rgba(255,122,26,.3);animation:ho-breathe 5s ease-in-out infinite}

/* menu */
.menu .btn{border-radius:10px;border-left:4px solid var(--sig);transition:transform .2s var(--ho-ease),border-color .2s,color .2s}
.menu .btn:hover{transform:translateX(4px)}

/* radio and transmissions */
.radio{border-radius:14px;box-shadow:inset 0 0 40px rgba(0,0,0,.6),var(--ho-shadow)}
.tx{border-radius:0 10px 10px 0}
.meter{border-radius:99px;overflow:hidden}

/* map */
.mapbox{border-radius:18px;box-shadow:inset 0 0 60px rgba(0,0,0,.6),var(--ho-shadow-lg);overflow:hidden}
.mk{box-shadow:0 0 0 4px rgba(0,0,0,.35)}
.mk.sel{box-shadow:0 0 0 4px rgba(255,122,26,.3),0 0 22px rgba(255,122,26,.5)}

/* achievements, toast, how to play */
.ach div{border-radius:12px}
.ach div.on{background:rgba(227,168,58,.08);box-shadow:0 0 18px rgba(227,168,58,.14)}
#toast{border-radius:12px;background:var(--panel2);border-color:var(--ho-gold-dim);box-shadow:var(--ho-shadow-lg)}
.how-ov{background:rgba(2,6,8,.8);backdrop-filter:blur(3px)}
.how{border-color:var(--ho-gold-dim);border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));animation:ho-rise .28s var(--ho-ease)}
.how h2{color:var(--ho-gold)}
@media(prefers-reduced-motion:reduce){body,.title .logo,.how{animation:none!important}.btn,.choice,.menu .btn{transition:none}}
.pvbanner{position:sticky;top:0;z-index:60;margin:0;padding:.55rem 1rem;text-align:center;font-weight:700;background:#f2c14e;color:#17110a;border-bottom:2px solid #17110a}
.sigtxt{word-break:break-word}
</style>

<script>

 ACH.forEach(function(x){if(x.id==='tells')x.d='Find 4 tells in '+SN.name+'\'s story.'});
 window.LL_ACTIVE=UNASSIGNED?null:SC}

var SIG_EXTRA={
 radio:{id:'g',t:'The carrier drifts 0.2 MHz each cycle, like a weak transmitter on failing batteries.',ok:true,w:'A drifting carrier means a real, struggling transmitter is out there, not just a looping recording.'},

};

var S=load()||fresh();S.case=CASE;
var AC=null,NOISE=null,NG=null;

function load(){if(UNASSIGNED)return mem;try{var v=localStorage.getItem(KEY());if(v)return JSON.parse(v)}catch(e){}return mem}
function save(){mem=S;if(UNASSIGNED)return;try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(t){t=(t||'').trim();return t?t.split(/\s+/).length:0}
function getP(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},S)}
function setP(p,v){var k=p.split('.'),o=S;for(var i=0;i<k.length-1;i++){if(!o[k[i]])o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=v}
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},3300)}
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
function blip(f,d,ty){if(!S.sound)return;try{var c=ac(),o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function staticOn(){if(!S.sound||NG)return;try{var c=ac(),len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=c.createBufferSource();NOISE.buffer=b;NOISE.loop=true;NG=c.createGain();NG.gain.value=.05;NOISE.connect(NG);NG.connect(c.destination);NOISE.start()}catch(e){NG=null}}
function staticSet(v){if(NG)try{NG.gain.value=Math.max(0,Math.min(.12,v*.12))}catch(e){}}
function staticOff(){try{if(NOISE)NOISE.stop()}catch(e){}NOISE=null;NG=null}
function xp(n,why){S.xp+=n;toast('+'+n+' XP: '+why)}
function award(id){if(S.ach[id])return;S.ach[id]=true;var a=ACH.filter(function(x){return x.id===id})[0];setTimeout(function(){toast('Achievement unlocked: '+a.n);blip(880,.3)},1000)}
function rank(){var r=RANKS[0],nx=null;for(var i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null}}return {name:r[1],lo:r[0],hi:nx?nx[0]:r[0]+1,max:!nx}}
function bgd(){return BG.filter(function(b){return b.id===S.bg})[0]||{tag:'',n:'',perk:''}}
function has(tag){return bgd().tag===tag}
function logIt(t){S.log.push({day:S.day,t:t})}
function clue(t){if(S.clues.indexOf(t)<0)S.clues.push(t)}
function snap(){var c=S.cp;S.cp=null;var s=JSON.stringify(S);S.cp=c;return s}
function mdone(){return Object.keys(S.done).length}

function advance(n){
 for(var i=0;i<n;i++){
  S.day++;
  S.res.food--;S.res.water--;
  if(S.res.food<0){S.res.food=0;S.hp--;logIt('You went hungry. Health -1.')}
  if(S.res.water<0){S.res.water=0;S.hp--;logIt('You went without water. Health -1.')}
 }
 if(S.hp<=0){S.screen='over'}
}

 if(st===2){

  return head+'<div class="tx">'+SC.signal.tx.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div>'+
   '<h3>What stands out? (Choose everything that raises a question.)</h3>'+picks+

   (m.judged?'':'<p style="margin-top:.6rem"><button class="btn" data-act="sig-judge">Submit analysis</button></p>')+fb+
   (m.judged?'<p><button class="btn" data-act="sig-next">Decide what to do</button></p>':'')}
 if(st===3)return head+'<div class="panel"><p>The message loops again. Your settlement is asleep. You are the only one who has heard it.</p>'+
  (m.checked?'<div class="fb"><b>You count what you have:</b> '+RES.map(function(r){return r[1]+' '+S.res[r[0]]}).join(', ')+'. Every trip costs 1 food and 1 water.</div>':'')+
  '<button class="choice" data-act="sig-dec" data-v="investigate">Investigate the signal<small>Follow it to '+esc(SC.locs.cin.n)+' and '+esc(SC.locs.hol.n)+'. Both open on the map.</small></button>'+
  '<button class="choice" data-act="sig-dec" data-v="ignore">Ignore it, for now<small>Stay safe. You may close off future signals tied to this one.</small></button>'+
  (m.checked?'':'<button class="choice" data-act="sig-dec" data-v="supplies">Check your supplies first<small>Take stock, then decide. It costs nothing but time.</small></button>')+'</div>';
 if(st===4)return head+journalStep('Record what you heard and what you decided. Say what you noticed, what you feel, and why you chose it.','The Signal');

},

supply:function(){

stranger:function(){
 var m=S.m,st=m.step,head='<h2>The Stranger</h2>';
 var tells=m.tells||[];
 if(st===0)return head+'<div class="panel"><p>'+esc(SN.open)+'</p>'+
  '<div class="tx"><p>'+esc(SN.quote)+'</p></div>'+
  (S.flags.warned?'<p class="muted">'+esc(SN.warned)+'</p>':'')+
  '<button class="btn" data-act="str-start">Talk to '+esc(SN.name)+'</button></div>';
 if(st===1){
  var node=m.node||'start',N=strNode(node);
  var ch=N.ch.map(function(c){return '<button class="choice" data-act="str-ch" data-v="'+c.id+'"'+(c.off?' disabled':'')+'>'+esc(c.t)+(c.s?'<small>'+c.s+'</small>':'')+'</button>'}).join('');
  var found=tells.length?'<div class="panel" style="margin-top:1rem"><h3>What you have noticed</h3><ul style="padding-left:1.1rem">'+tells.map(function(t){return '<li>'+esc(SN.tells[t])+'</li>'}).join('')+'</ul></div>':'';
  return head+'<div class="tx"><p>'+N.say+'</p></div>'+(N.note?'<p class="muted">'+N.note+'</p>':'')+'<p class="muted">Trust: '+(m.trust||0)+'. Talk to '+PN.o+' at least twice, then you can make your decision.</p>'+ch+
   (m.talks>=2?'<button class="btn" data-act="str-next">I\'m ready to decide</button>':'')+found}
 if(st===2)return head+'<div class="panel"><p>'+esc(SN.name)+' will not answer direct questions. Write what you will say to '+PN.o+': <b>2 to 3 lines</b>. Get more truth <b>without accusing '+PN.o+'</b>. Use at least one question.</p>'+
  '<textarea data-bind="m.dlg" aria-label="Your dialogue">'+esc(m.dlg||'')+'</textarea>'+count('m.dlg',15)+'<p style="margin-top:.6rem"><button class="btn" data-act="str-say">Say it to Wren</button></p>'+(m.dlgfb||'')+'</div>';
 if(st===3){
  var pk=(m.sus||[]);
  return head+'<div class="panel"><h3>Do you trust '+PN.o+'?</h3><p>Choose the tells that make you doubt '+PN.p+' story. Then explain your decision.</p>'+
   (tells.length?tells.map(function(t){var on=pk.indexOf(t)>-1;return '<label class="pick'+(on?' sel':'')+'"><input type="checkbox" data-sus="'+t+'"'+(on?' checked':'')+'><span>'+esc(SN.tells[t])+'</span></label>'}).join(''):'<p class="muted">You have not noticed any tells.</p>')+
   '<textarea data-bind="m.why" aria-label="Your reasoning" style="margin-top:.5rem">'+esc(m.why||'')+'</textarea>'+count('m.why',25)+'<p style="margin-top:.6rem"><button class="btn" data-act="str-why">Continue to the decision</button></p></div>'}
 if(st===4)return head+'<div class="panel"><p>'+esc(SN.name)+' waits. Your choice will cost something either way.</p>'+
  '<button class="choice" data-act="str-dec" data-v="help"'+(S.res.meds<1?' disabled':'')+'>Help '+PN.o+' fully<small>-1 meds, -1 food. '+PN.S+' may give you something in return.</small></button>'+
  '<button class="choice" data-act="str-dec" data-v="trade"'+(S.str==='voice'?'':(S.res.meds<1?' disabled':''))+'>Trade for information<small>'+(S.str==='voice'?'Persuasive: you talk '+PN.o+' into it for free.':'-1 meds. '+PN.S+' tells you what '+PN.s+' knows.')+'</small></button>'+
  '<button class="choice" data-act="str-dec" data-v="refuse">Send '+PN.o+' away<small>You keep your supplies. You may never learn what '+PN.s+' knows.</small></button></div>';
 if(st===5)return head+'<div class="panel"><h3>Radio '+esc(SC.locs.home.n)+'</h3><p>Your settlement is waiting for word. You have a few seconds of battery. Send a message of <b>20 words or fewer</b>. It must say <b>what you found</b>, <b>where you are</b>, and <b>what you need</b> or what to watch for.</p>'+
  '<textarea style="min-height:90px" data-bind="m.radio" aria-label="Radio message">'+esc(m.radio||'')+'</textarea>'+count('m.radio',5,20)+'<p style="margin-top:.6rem"><button class="btn" data-act="str-radio">Transmit</button></p>'+(m.radiofb||'')+'</div>';
 if(st===6)return head+journalStep('Write about '+SN.name+'. What did you notice, what did you choose, and what do you still not know?','The Stranger');
 return head
}
};
function strNode(n){
 var m=S.m,P=S.pers,B=bgd().tag,t=function(id){return (m.tells||[]).indexOf(id)>-1};
 var ch=[],say='',note='';
 if(n==='start'){say=SN.start;
  ch=[{id:'brother',t:SN.ch.brother},{id:'inspect',t:SN.ch.inspect},{id:'route',t:SN.ch.route}];
  if(P==='suspicious')ch.push({id:'press',t:'"Your story has holes. Start over."',s:'Suspicious'});
  if(P==='empathetic')ch.push({id:'comfort',t:'Tell '+PN.o+' you understand how frightening this is.',s:'Empathetic'});
  if(P==='bold')ch.push({id:'block',t:'Step into the road and tell '+PN.o+' '+PN.s+' is not going anywhere until you hear the truth.',s:'Bold'});
  if(P==='cautious')ch.push({id:'watch',t:'Keep your distance and watch the road with '+PN.o+'.',s:'Cautious'});
 }else{say=m.say||'';ch=[{id:'again',t:'Ask something else.'}]}
 if(n!=='start'){say=m.say;note=m.note;ch=strNode('start').ch}
 ch.forEach(function(c){c.off=!!(m.used&&m.used[c.id])});
 return {say:say,note:note,ch:ch}
}
function strTalk(id){
 var m=S.m;m.used=m.used||{};if(m.used[id])return;m.used[id]=true;m.tells=m.tells||[];m.talks=(m.talks||0)+1;m.trust=m.trust||(S.flags.warned?1:0);
 function tell(k){if(m.tells.indexOf(k)<0){m.tells.push(k);if(m.tells.length>=4)award('tells')}}
 var say='',note='';
 if(id==='brother'){tell('story');say=SN.brother.say;note=SN.brother.note}
 else if(id==='inspect'){
  if(S.weak!=='trust')tell('clay');tell('badge');
  say=SN.inspect.say;
  note=(S.weak==='trust'?SN.inspect.trust:SN.inspect.full)+(has('med')?SN.inspect.med:'')+(has('mil')?SN.inspect.mil:'');
  if(has('mil'))tell('road')}
 else if(id==='route'){tell('never');if(S.weak==='trust'&&m.tells.indexOf('clay')<0)tell('clay');say=SN.route.say;note=SN.route.note}
 else if(id==='press'){m.trust--;tell('story');say=SN.press.say;note=PN.S+' snapped, then stopped '+PN.r+'. Trust -1.'}
 else if(id==='comfort'){m.trust++;tell('road');say=SN.comfort.say;note='Empathy lowers '+PN.p+' guard. Trust +1.'}
 else if(id==='block'){m.trust--;tell('road');say=SN.block.say;note=PN.S+' is more afraid of something behind '+PN.o+' than of you. Trust -1.'}
 else if(id==='watch'){tell('road');say=SN.watch.say;note='Standing together, you notice '+PN.s+' keeps checking the road behind '+PN.o+'.'}
 m.say=say;m.note=note;m.node='x';
}

/* ---------- rendering ---------- */
function render(){
 var f=SCREENS[S.screen]||SCREENS.title;
 if(S.screen==='mission'&&!S.m){S.screen='map';f=SCREENS.map}
 document.getElementById('app').innerHTML=pvBanner()+f();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act],[data-go],[data-loc],[data-cr],[data-take]');if(!el)return;
 if(el.dataset.act==='sound'){S.sound=el.checked;if(!S.sound)staticOff();save();return}
 if(el.dataset.go){ev.preventDefault();go(el.dataset.go);return}
 if(el.dataset.loc){S.sel=el.dataset.loc;save();render();return}
 if(el.dataset.cr){var p=el.dataset.cr.split(':');S.cr[p[0]]=p[1];save();render();return}
 if(el.dataset.take){var m=S.m;m.take=m.take||[];var i=m.take.indexOf(el.dataset.take);if(i>-1)m.take.splice(i,1);else m.take.push(el.dataset.take);save();render();return}
 var a=el.dataset.act;if(!a)return;ev.preventDefault();
 var m=S.m;
 if(a==='menu'){staticOff();S.screen='menu';save();render();window.scrollTo(0,0)}
 else if(a==='resume'){S.screen=S.m?'mission':'map';save();render()}
 else if(a==='newgame'){if(S.started&&!confirm('Start a new game? This erases your current progress unless you exported it.'))return;var sd=S.sound;if(UNASSIGNED){var rn=HOV.roll();HOV.assign(GAME,rn);UNASSIGNED=false;useScenario(rn)}S=fresh();S.sound=sd;S.screen='create';save();render()}
 else if(a==='start'){var c=S.cr;
  if((c.name||'').trim().length<2){toast('Enter a name for your survivor.');return}
  if(!c.bg||!c.pers||!c.str||!c.weak){toast('Choose a background, personality, strength, and weakness.');return}
  S.name=c.name.trim();S.vs=String(HOV.hash(CASE+'|'+S.name.toLowerCase()));S.bg=c.bg;S.pers=c.pers;S.str=c.str;S.weak=c.weak;
  var b=bgd();Object.keys(b.res).forEach(function(k){S.res[k]+=b.res[k]});
  if(c.weak==='thirst')S.res.water=Math.max(0,S.res.water-1);if(c.weak==='nerves')S.res.batt=Math.max(0,S.res.batt-1);
  S.started=true;S.screen='map';S.sel='home';logIt('Survivor '+S.name+' '+SC.wake);save();render();window.scrollTo(0,0)}
 else if(a==='travel'){
  var k=S.sel,o=LOCS[k];if(locState(k)==='lock'||S.done[o.m])return;
  if(k!=='home'){S.cp=null;S.cp=snap();advance(1);logIt('Traveled to '+o.n+'.');if(S.screen==='over'){save();render();return}}
  newM(o.m);save();render();window.scrollTo(0,0)}
 else if(a==='backmap'){S.m=null;S.screen='map';staticOff();save();render()}
 else if(a==='retry'){if(S.cp){var sv=S.sound,ac2=S.ach;S=JSON.parse(S.cp);S.sound=sv;for(var q in ac2)S.ach[q]=true;S.screen='map';S.cp=null;save();render()}}
 else if(a==='addjournal'){if(wc(S.extra)<20){toast('Write at least 20 words.');return}S.journal.push({day:S.day,title:'Personal entry',text:S.extra.trim()});S.extra='';xp(5,'Journal entry');save();render()}
 else if(a==='savejournal'){finishM(el.dataset.title,25)}
 /* signal */
 else if(a==='sig-power'){
  if(!has('mech')&&!S.flags.crank){if(S.res.batt<1){toast('No batteries. Find some, or a hand-crank radio.');return}S.res.batt--}
  m.step=1;m.freq=900;staticOn();staticSet(1);save();render()}
 else if(a==='sig-lock'){staticOff();blip(520,.2);if(SC.signal.decode){m.sub='decode';m.shift=0;m.ans='';save();render();return}award('tuned');xp(10,'Signal locked');m.step=2;save();render()}
 else if(a==='sig-decode'){var dd=SC.signal.decode,okd=dd.kind==='shift'?shiftText(SC.signal.dialMsg,m.shift||0)===SC.signal.msg:(m.ans||'').trim().toUpperCase()===dd.answer;
  if(!okd){toast(dd.kind==='shift'?'That still does not read as plain English. Keep sliding.':'Not yet. Check each number or word against the key.');return}
  blip(520,.2);award('tuned');xp(15,'Signal locked and decoded');m.sub=null;m.step=2;save();render()}
 else if(a==='sig-judge'){
  var obs=sigObs();
  var pk=m.pick||[],right=obs.filter(function(o){return o.ok&&pk.indexOf(o.id)>-1}).length,wrong=obs.filter(function(o){return !o.ok&&pk.indexOf(o.id)>-1}).length;
  if(wc(m.reason)<25){toast('Explain your reasoning in at least 25 words.');return}
  m.right=right;m.judged=true;xp(Math.max(0,right-wrong)*7+10,'Signal analysis');if(right>=3)award('doubt');save();render()}
 else if(a==='sig-next'){m.step=3;save();render()}
 else if(a==='sig-dec'){var v=el.dataset.v,F=S.flags;F.heard=true;
  if(v==='investigate'){F.investigate=true;logIt('Chose to investigate the signal.')}
  else if(v==='ignore'){F.ignored=true;logIt('Chose to ignore the signal. Some signals may now stay silent.')}
  else{F.supplies=true;m.checked=true;logIt('Took stock of supplies before deciding.');save();render();return}
  m.step=4;save();render()}
 /* supply */
 else if(a==='sup-start'){m.step=1;save();render()}
 else if(a==='sup-pack'){
  var take=m.take||[];take.forEach(function(id){var i=itm(id);
   if(i.fx)Object.keys(i.fx).forEach(function(k){S.res[k]+=i.fx[k]});
   if(i.flag)S.flags[i.flag]=true;if(i.clue)clue(i.clue);S.inv.push(i.n)});
  logIt('Packed '+take.length+' items from '+SC.locs.cin.n+'.');award('bag');xp(15,'Smart packing');m.step=2;save();render()}
 else if(a==='sup-ev'){var v2=el.dataset.v;
  if(v2==='look'){S.res.batt--;clue(SC.supply.notebook);logIt('Found a survivor\'s notebook upstairs.');xp(10,'You investigated')}
  else if(v2==='sneak'){clue(SC.supply.notebook);logIt('Slipped upstairs and found a notebook.');xp(10,'Quiet and careful')}
  else{logIt('Left the noise upstairs alone.')}
  m.step=3;save();render()}
 else if(a==='sup-warn'){
  var w=(m.warn||'').trim(),n=wc(w),hz=(w.match(new RegExp(HAZ.source+(SC.supply.haz?'|'+SC.supply.haz:''),'gi'))||[]).filter(function(x,i,arr){return arr.indexOf(x)===i}).length,vb=VERBS.test(w);
  if(n<20||n>60){toast('Write between 20 and 60 words.');return}
  var ok=hz>=2&&vb;
  m.warnfb='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'Posted. Future survivors can use this.':'Not clear enough yet.')+'</b> '+(hz>=2?'You named real hazards.':'Name at least two specific hazards ('+SC.supply.hazEx+').')+' '+(vb?'You gave them something to do.':'Tell them what to do, not only what to fear: use verbs like avoid, stay, or check.')+'</div>';
  if(ok){S.flags.warned=true;award('warn');xp(20,'Useful warning');logIt('Posted a warning on the door.');m.step=4}
  else m.warnfb+='<p class="muted">Edit your warning and post it again.</p>';
  save();render()}
 /* stranger */
 else if(a==='str-start'){m.step=1;m.node='start';m.talks=0;m.trust=S.flags.warned?1:0;m.tells=[];save();render()}
 else if(a==='str-ch'){strTalk(el.dataset.v);save();render()}
 else if(a==='str-next'){m.step=2;save();render()}
 else if(a==='str-say'){
  if(m.dlgdone){toast(SN.name+' already answered.');return}
  var d=(m.dlg||'').trim();
  if(wc(d)<15){toast('Write at least 15 words.');return}

  if(!q){m.dlgfb='<div class="fb bad">Include at least one question. Questions invite answers.</div>';save();render();return}
  if(acc){m.trust--;m.dlgfb='<div class="fb bad"><b>'+PN.S+' shuts down.</b> Accusing '+PN.o+' made '+PN.o+' defensive. Trust -1. Rewrite your lines so they invite '+PN.o+' to explain.</div>';save();render();return}
  if((m.tells||[]).indexOf('nurse')<0){m.tells.push('nurse')}
  m.dlgdone=true;m.trust++;xp(15,'Dialogue with subtext');
  m.dlgfb='<div class="fb good"><b>It works.</b> '+esc(SN.name)+' exhales: '+esc(SN.admit)+' Trust +1.</div><p><button class="btn" data-act="str-next2">Continue</button></p>';
  save();render()}
 else if(a==='str-next2'){m.step=3;save();render()}
 else if(a==='str-why'){if(wc(m.why)<25){toast('Explain your decision in at least 25 words.');return}xp(15,'You reasoned it out');m.step=4;save();render()}
 else if(a==='str-dec'){var v3=el.dataset.v,F2=S.flags;
  if(v3==='help'){S.res.meds--;S.res.food--;F2.helped=true;S.res.batt+=1;logIt(SN.helpLog);clue(SN.helpClue)}
  else if(v3==='trade'){if(S.str!=='voice')S.res.meds--;F2.traded=true;logIt('Traded with '+SN.name+' for information.');clue(SN.tradeClue)}
  else{F2.refused=true;logIt('Turned '+SN.name+' away.')}
  if(S.res.food<0)S.res.food=0;if(S.res.meds<0)S.res.meds=0;
  m.step=5;save();render()}
 else if(a==='str-radio'){
