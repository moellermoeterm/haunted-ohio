<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0c;--panel:#161a15;--panel2:#1f251e;--line:#34402f;--steel:#7b8a8c;
  --moss:#8aa476;--amber:#e3a83a;--sig:#ff7a1a;--text:#e1e5d8;--muted:#9aa595;--bad:#e0594a;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;--ui:'Atkinson Hyperlegible',system-ui,'Segoe UI',sans-serif;--mono:'Share Tech Mono','Courier New',monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:7rem}
body{margin:0;background:linear-gradient(180deg,#171c15 0,var(--bg) 340px) fixed;color:var(--text);font-family:var(--ui);font-size:1.05rem;line-height:1.55;min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:.02em;line-height:1.05;margin:0 0 .6rem}
h1{font-size:clamp(3rem,11vw,6.5rem)}h2{font-size:2rem}h3{font-size:1.4rem}
p{margin:0 0 .8rem}
a{color:var(--amber)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.wrap{max-width:none;margin:0 auto;padding:1rem}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.btn{background:var(--sig);color:#1a0f05;border:0;padding:.7rem 1.3rem;border-radius:2px;font-family:var(--disp);font-size:1.2rem;font-weight:700;letter-spacing:.04em;min-height:46px}
.btn:hover{background:#ff9140}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--steel)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:1rem;padding:.4rem .8rem;min-height:38px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:1rem 1.1rem}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:1rem;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
@media(max-width:760px){.split,.grid2{grid-template-columns:1fr}}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:rgba(13,15,12,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hud-in{max-width:none;margin:0 auto;padding:.45rem 1rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:.5rem;align-items:center;font-family:var(--disp);font-size:1.4rem;color:var(--text);text-decoration:none;margin-right:auto}
.brand img{width:34px;height:34px;border-radius:50%}
.meters{display:flex;gap:.4rem;flex-wrap:wrap}
.m{background:var(--panel2);border:1px solid var(--line);padding:.1rem .55rem;border-radius:2px;font-size:.9rem;white-space:nowrap}
.m b{font-family:var(--mono);color:var(--amber);font-weight:400}
.m.low b{color:var(--bad)}
.tabs{max-width:none;margin:0 auto;padding:0 1rem;display:flex;gap:.3rem;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:.5rem .9rem;font-family:var(--disp);font-size:1.15rem;min-height:42px;white-space:nowrap;color:var(--muted)}
.tab[aria-current="page"]{color:var(--sig);border-color:var(--sig)}
.tab.locked{opacity:.5}

/* title */
.title{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 1.2rem 3rem;position:relative;overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(13,15,12,.1) 0,rgba(13,15,12,.92) 85%),
  radial-gradient(ellipse at 70% 30%,rgba(255,122,26,.45),rgba(255,122,26,0) 55%),
  linear-gradient(180deg,#2a2218 0,#0d0f0c 100%)}
.skyline{position:absolute;left:0;right:0;bottom:30%;height:34%;opacity:.55}
.title>*{position:relative}
.title .logo{width:84px;height:84px;border-radius:50%;margin-bottom:1rem}
.title h1{color:#f3eadb;text-shadow:0 0 40px rgba(255,122,26,.35);margin-bottom:.2rem}
.tag{font-family:var(--mono);color:var(--sig);font-size:1.05rem;max-width:30rem}
.signal-line{width:min(460px,90%);height:3px;background:var(--sig);margin:1rem 0;transform-origin:left;animation:sweep 3.2s ease-in-out infinite;box-shadow:0 0 14px var(--sig)}
@keyframes sweep{0%,100%{transform:scaleX(.15);opacity:.5}50%{transform:scaleX(1);opacity:1}}

.menu{max-width:520px;margin:3rem auto;display:grid;gap:.7rem}
.menu .btn{text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);font-size:1.45rem;padding:.9rem 1.2rem}
.menu .btn:hover{border-color:var(--sig);color:var(--sig)}
.menu .btn.primary{background:var(--sig);color:#1a0f05;border-color:var(--sig)}

/* forms */
label{display:block;font-weight:700;margin-bottom:.3rem}
input[type=text],textarea,select{width:100%;font:inherit;padding:.6rem .7rem;border-radius:2px;border:2px solid var(--line);background:#0a0c09;color:var(--text)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.count{font-size:.85rem;color:var(--muted);text-align:right;font-family:var(--mono)}
.count.ok{color:var(--moss)}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);padding:.7rem .9rem;margin-bottom:.5rem;border-radius:2px;min-height:46px}
.choice:hover{border-color:var(--sig)}
.choice small{display:block;color:var(--muted);font-size:.85rem}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.pick{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .8rem;border:2px solid var(--line);border-radius:2px;margin-bottom:.5rem;cursor:pointer;background:var(--panel2)}
.pick:hover{border-color:var(--amber)}
.pick input{margin-top:.35rem;width:20px;height:20px;flex:none}
.pick.sel{border-color:var(--amber)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem}
.opt{background:var(--panel2);border:2px solid var(--line);padding:.6rem .8rem;border-radius:2px;text-align:left;min-height:46px}
.opt.on{border-color:var(--sig);background:#2a2013}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.fb{margin:.8rem 0;padding:.7rem .9rem;border-left:5px solid var(--amber);background:rgba(227,168,58,.1)}
.fb.good{border-color:var(--moss);background:rgba(138,164,118,.12)}
.fb.bad{border-color:var(--bad);background:rgba(224,89,74,.1)}

/* radio */
.radio{background:#0a0c09;border:2px solid var(--line);border-radius:4px;padding:1rem;font-family:var(--mono)}
.freq{font-size:2.6rem;color:var(--sig);text-shadow:0 0 14px rgba(255,122,26,.5);line-height:1}
.meter{height:14px;background:#1b2119;border:1px solid var(--line);margin:.5rem 0}
.meter i{display:block;height:100%;background:var(--sig);transition:width .1s}
.sigtxt{min-height:3.4em;color:var(--moss);letter-spacing:.04em;margin-top:.5rem;word-break:break-word}
input[type=range]{width:100%;height:44px;accent-color:var(--sig)}
.tx{background:#0a0c09;border-left:4px solid var(--sig);padding:.8rem 1rem;font-family:var(--mono);color:#cfe0c4;margin:.7rem 0}
.tx p{margin:0 0 .4rem}

/* map */
.mapbox{position:relative;max-width:560px;margin:0 auto;aspect-ratio:400/420;background:#0a0d0a;border:1px solid var(--line)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid var(--moss);background:#10150f;display:grid;place-items:center;font-family:var(--disp);font-size:1.2rem;padding:0}
.mk.here{border-color:var(--amber)}
.mk.todo{border-color:var(--sig);animation:pulse 2s infinite}
.mk.lock{border-color:#3a4338;color:#59635a}
.mk.sel{background:var(--sig);color:#1a0f05}
.mk-l{position:absolute;transform:translate(-50%,0);font-size:.72rem;color:var(--muted);white-space:nowrap;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.5)}50%{box-shadow:0 0 0 10px rgba(255,122,26,0)}}
.bar{height:10px;background:#1b2119;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--moss)}.bar.low i{background:var(--bad)}
.item{display:flex;justify-content:space-between;gap:1rem}
.entry{border-left:3px solid var(--line);padding-left:.8rem;margin-bottom:1rem}
.entry h3{margin-bottom:.2rem}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(30px);background:#000;border:2px solid var(--sig);padding:.6rem 1rem;border-radius:3px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.ach div{padding:.7rem;border:2px dashed var(--line);border-radius:3px;opacity:.55}
.ach div.on{opacity:1;border:2px solid var(--amber)}
@media(prefers-reduced-motion:reduce){.signal-line,.mk.todo{animation:none}#toast,.meter i{transition:none}}

.how-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;padding:1rem}
.how{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;max-width:42rem;width:100%;max-height:min(88vh,46rem);overflow:auto;padding:1.2rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.how h2{margin-bottom:.4rem}.how h2:focus{outline:none}.how h3{margin-top:1rem}
.how ol,.how ul{padding-left:1.3rem;margin:.4rem 0}.how li{margin:.5rem 0}
</style>

create:function(){
 var c=S.cr;
 function grp(title,arr,key,sub){return '<h3 style="margin-top:1rem">'+title+'</h3><div class="opts">'+arr.map(function(o){return '<button class="opt'+(c[key]===o.id?' on':'')+'" data-cr="'+key+':'+o.id+'">'+o.n+'<small>'+(o.perk||o.d)+'</small></button>'}).join('')+'</div>'}
 return '<div class="wrap" style="max-width:820px"><h2>Create your survivor</h2><p class="muted">Your choices change what you can notice, what you can say, and what you start with.</p>'+
  '<label for="nm">Name</label><input id="nm" type="text" maxlength="24" data-bind="cr.name" value="'+esc(c.name)+'" autocomplete="off">'+
  grp('Background',BG,'bg')+grp('Personality',PERS,'pers')+grp('Strength',STR,'str')+grp('Weakness',WEAK,'weak')+
  '<p style="margin-top:1.4rem"><button class="btn" data-act="start">Start the story</button></p></div>'},

map:function(){
 var L=LOCS,html='';
 var marks=Object.keys(L).map(function(k){var o=L[k],st=locState(k);
   return '<button class="mk '+st+(S.sel===k?' sel':'')+'" style="left:'+o.x+'%;top:'+o.y+'%" data-loc="'+k+'" aria-label="'+o.n+'">'+(st==='lock'?'&#9632;':(S.done[o.m]?'&#10003;':o.i))+'</button><span class="mk-l" style="left:'+o.x+'%;top:calc('+o.y+'% + 26px)">'+o.n+'</span>'}).join('');
 var info='';
 if(S.sel){var o=L[S.sel],st=locState(S.sel);
   info='<div class="panel" style="margin-top:1rem"><h3>'+o.n+'</h3><p>'+o.d+'</p>';
   if(st==='lock')info+='<p class="muted">'+(o.lock||'Locked. Finish The Signal first.')+'</p>';
   else if(S.done[o.m])info+='<p class="muted">Mission complete.</p>';
   else if(S.sel==='home')info+='<button class="btn" data-act="travel">Go to the radio room</button>';
   else info+='<p class="muted">Travel takes 1 day: -1 food, -1 water.</p><button class="btn" data-act="travel">Travel here</button>';
   info+='</div>'}
 var done=mdone();
 return hud()+'<div class="wrap"><h2>Ohio, 2047</h2><p class="muted">Locations: choose where to go. Every trip costs a day of food and water.</p>'+
  '<div class="mapbox"><svg viewBox="0 0 400 420" aria-hidden="true"><polygon points="40,60 150,50 200,70 260,55 350,40 358,150 350,230 320,300 280,370 210,400 110,385 40,370" fill="#121a12" stroke="#4a5d46" stroke-width="2"/>'+
  '<g fill="#59635a" font-size="11"><text x="52" y="46">Toledo</text><text x="270" y="34">Cleveland</text><text x="150" y="196">Columbus</text></g></svg>'+marks+'</div>'+info+
  (done>=3?'<div class="fb good"><b>The signal leads somewhere underground.</b> The next stage of the game opens that path. For now, your story is ready: the final story is unlocked once you have 3 journal entries.</div>':'')+'</div>'
},

mission:function(){return hud()+'<div class="wrap">'+(MISSIONS[S.m&&S.m.id]||function(){return '<p>No mission.</p>'})()+'</div>'},

pack:function(){
 var inv=S.inv.map(function(i){return '<li>'+esc(i)+'</li>'}).join('');
 return hud()+'<div class="wrap"><h2>Pack and resources</h2><div class="grid2"><div class="panel"><h3>Resources</h3>'+
  RES.map(function(r){var v=S.res[r[0]];return '<div class="item"><span>'+r[1]+'</span><b>'+v+'</b></div><div class="bar'+(v<=1?' low':'')+'"><i style="width:'+Math.min(100,v*12)+'%"></i></div>'}).join('<div style="height:.4rem"></div>')+
  '<p class="muted" style="margin-top:.8rem">Each day costs 1 food and 1 water. Run out and you lose health.</p></div>'+
  '<div class="panel"><h3>Inventory</h3><ul style="padding-left:1.1rem">'+inv+'</ul><h3 style="margin-top:1rem">Clues and transmissions</h3>'+
  (S.clues.length?'<ul style="padding-left:1.1rem">'+S.clues.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>':'<p class="muted">Nothing yet.</p>')+'</div></div></div>'
},

journal:function(){
 var e=S.journal.slice().reverse().map(function(j){return '<div class="entry"><h3>Day '+j.day+': '+esc(j.title)+'</h3><p style="white-space:pre-wrap">'+esc(j.text)+'</p></div>'}).join('');
 return hud()+'<div class="wrap" style="max-width:760px"><h2>Journal</h2><p class="muted">Journal entries are saved. You can add one any time.</p>'+
  '<div class="panel"><label for="ex">New entry</label><textarea id="ex" data-bind="extra">'+esc(S.extra||'')+'</textarea>'+count('extra',20)+'<p style="margin-top:.6rem"><button class="btn sm" data-act="addjournal">Save entry</button></p></div>'+
  '<div style="margin-top:1.2rem">'+(e||'<p class="muted">No entries yet. You will be asked to write after each mission.</p>')+'</div></div>'
},

log:function(){return hud()+'<div class="wrap" style="max-width:760px"><h2>Mission log</h2>'+(S.log.length?S.log.slice().reverse().map(function(l){return '<div class="entry"><span class="muted">Day '+l.day+'</span><br>'+esc(l.t)+'</div>'}).join(''):'<p class="muted">Nothing logged yet.</p>')+'</div>'},

me:function(){
 var r=rank(),b=bgd(),g=function(a,id){return a.filter(function(x){return x.id===id})[0]||{n:'-'}};
 return hud()+'<div class="wrap"><h2>'+esc(S.name||'Survivor')+'</h2><div class="grid2"><div class="panel"><h3>'+r.name+'</h3><p>'+S.xp+' XP'+(r.max?'':', next rank at '+r.hi+' XP')+'</p>'+
  '<p class="muted">XP rewards careful thinking and strong writing, not speed.</p>'+
  '<p><b>Background:</b> '+b.n+'<br><span class="muted">'+b.perk+'</span></p><p><b>Personality:</b> '+g(PERS,S.pers).n+'<br><b>Strength:</b> '+g(STR,S.str).n+'<br><b>Weakness:</b> '+g(WEAK,S.weak).n+'</p></div>'+
  '<div class="panel"><h3>Achievements</h3><div class="ach">'+ACH.map(function(a){return '<div class="'+(S.ach[a.id]?'on':'')+'"><b>'+a.n+'</b><br><span class="muted">'+a.d+'</span></div>'}).join('')+'</div></div></div></div>'
},

final:function(){
 var done=BEATS.filter(function(b){return wc(S.story[b.k])>=15}).length,F=S.flags;
 var dec=[];
 if(F.heard)dec.push(F.investigate?'You chose to investigate the signal.':(F.ignored?'You ignored the signal.':'You checked your supplies first.'));
 if(F.warned)dec.push('You posted a warning for future survivors.');
 if(F.helped)dec.push('You helped Wren.');if(F.traded)dec.push('You traded medicine to Wren for information.');if(F.refused)dec.push('You turned Wren away.');
 var jr=S.journal.map(function(j){return '<li><b>Day '+j.day+':</b> '+esc(j.title)+'</li>'}).join('');
 var beats=BEATS.map(function(b,i){var p='story.'+b.k;return '<div class="panel" style="margin-bottom:.8rem"><h3>'+(i+1)+'. '+b.n+'</h3><p class="muted">'+esc(b.p)+'</p><textarea style="min-height:110px" data-bind="'+p+'" aria-label="'+b.n+'">'+esc(S.story[b.k]||'')+'</textarea>'+count(p,15)+'</div>'}).join('');
 return hud()+'<div class="wrap"><h2>Final story: write your own survival horror</h2><p>Use what you lived through: the choices, the doubt, the silence. Invent your own character and world. Do not retell the game.</p>'+
  '<div class="split"><div>'+beats+'</div><div class="panel" style="position:sticky;top:7rem"><h3>Progress</h3><p><b>'+done+' of 10</b> beats complete.</p><h3>Your decisions</h3><ul style="padding-left:1.1rem">'+(dec.map(function(d){return '<li>'+d+'</li>'}).join('')||'<li>None yet.</li>')+'</ul>'+
  '<h3>Your journal</h3><ul style="padding-left:1.1rem">'+(jr||'<li>Empty.</li>')+'</ul><button class="btn" data-act="exportstory"'+(done<1?' disabled':'')+'>Download my story (.txt)</button></div></div></div>'
},

settings:function(){return (S.started?hud():'')+'<div class="wrap" style="max-width:640px"><h2>Save and settings</h2><div class="panel"><p>Your progress saves automatically in this browser on this device. To move to another device, export a save file and import it there.</p>'+
 '<div class="row"><button class="btn" data-act="export">Export save file</button><label class="btn ghost" style="margin:0;display:inline-block">Import save file<input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div>'+
 '<p class="muted" style="margin-top:.8rem">Clearing browser data erases your progress unless you exported a file.</p></div>'+
 '<div class="panel" style="margin-top:1rem"><label style="display:flex;gap:.6rem;align-items:center"><input type="checkbox" data-act="sound"'+(S.sound?' checked':'')+' style="width:20px;height:20px">Sound effects</label></div>'+
 '<div class="panel" style="margin-top:1rem"><p>Start over and erase this game?</p><button class="btn ghost" data-act="reset">Erase my progress</button></div>'+
 '<p style="margin-top:1rem"><button class="btn ghost" data-act="menu">Back to menu</button></p></div>'},

over:function(){return '<div class="wrap" style="max-width:640px;margin-top:3rem"><h2>The Silence takes another</h2><p>Your body gave out. Survival is a plan, not a hope. Food and water cost something every day.</p>'+
 (S.cp?'<p><button class="btn" data-act="retry">Return to your last checkpoint</button></p>':'')+'<p><button class="btn ghost" data-act="menu">Menu</button></p></div>'}
};

/* ---------- map data ---------- */
var LOCS={
 home:{n:'Haven Ridge',i:'H',x:17,y:52,m:'signal',d:'Your settlement. The radio room is in the old grain elevator. Tonight the receiver is picking up something.'},
 cin:{n:'Abandoned Cincinnati',i:'C',x:15,y:86,m:'supply',d:'A drowned skyline over the river. Pharmacies, stores, and offices still hold supplies, if the floors hold you.'},
 hol:{n:'Hollow Creek',i:'W',x:63,y:62,m:'stranger',d:'A rural crossroads with a burned-out gas station and a church on the hill. Smoke rose from your settlement; someone followed it.'},
 und:{n:'Site Nine',i:'U',x:31,y:70,m:'under',d:'An underground facility.',lock:'Locked. This location opens in the next stage of the game.'},
 moo:{n:'Moonville Tunnel',i:'M',x:57,y:82,m:'moon',d:'An abandoned railroad tunnel in the hills, wrapped in old stories.',lock:'Locked. This location opens in the next stage of the game.'},
 twr:{n:'Radio Tower',i:'T',x:42,y:46,m:'tower',d:'A tall tower east of Haven Ridge.',lock:'Locked. This location opens in the next stage of the game.'}
};
function locState(k){var o=LOCS[k];if(o.lock)return 'lock';if(S.done[o.m])return 'here';if(k==='cin'||k==='hol'){if(!S.done.signal)return 'lock'}return 'todo'}

/* ---------- missions ---------- */
function newM(id){S.m={id:id,step:0,done:false};S.screen='mission'}
function finishM(title,minw){
 var t=(S.m.jtext||'').trim();
 if(wc(t)<(minw||25)){toast('Write at least '+(minw||25)+' words in your journal entry.');return}
 var bonus=10+(SENSE.test(t)?5:0)+(has('stud')?5:0);
 S.journal.push({day:S.day,title:title,text:t});S.done[S.m.id]=true;logIt('Completed: '+title+'.');
 xp(bonus,'Journal entry');S.m=null;S.screen='map';S.sel=null;save();render();window.scrollTo(0,0)
}
function journalStep(prompt,title){
 return '<div class="panel"><h3>Journal</h3><p>'+prompt+'</p><textarea data-bind="m.jtext" aria-label="Journal entry">'+esc((S.m&&S.m.jtext)||'')+'</textarea>'+count('m.jtext',25)+'<p style="margin-top:.6rem"><button class="btn" data-act="savejournal" data-title="'+esc(title)+'">Save entry and return to map</button></p></div>'
}
function garble(clar){
 var msg='IF YOU CAN HEAR THIS, DO NOT GO LOOKING FOR THE LIGHT',g='#%&*?/\\=+~|',o='';
 for(var i=0;i<msg.length;i++){var ch=msg[i];o+=(ch===' '||Math.random()<clar)?ch:g[Math.floor(Math.random()*g.length)]}
 return o
}
function clarity(f){var tol=S.str==='hands'?120:90;return Math.max(0,1-Math.abs(f-964)/tol)}

var MISSIONS={
signal:function(){
 var m=S.m,st=m.step;
 var head='<h2>The Signal</h2>';
 if(st===0)return head+'<div class="panel"><p>It is past two in the morning. The grain elevator hums with the wind. On the old receiver, a needle twitches that has not moved in years.</p>'+
  '<div class="tx"><p>[STATIC] ... if you can hear this ... do not go looking for the light ...</p></div>'+
  '<p>It repeats. Someone, or something, is out there. Powering the receiver for a careful listen '+(has('mech')||S.flags.crank?'costs nothing for you.':'costs 1 battery.')+'</p>'+
  '<button class="choice" data-act="sig-power">Power the radio and tune in'+(has('mech')||S.flags.crank?'':'<small>-1 battery</small>')+'</button>'+
  '<button class="choice" data-act="backmap">Leave the radio room for now</button></div>';
 if(st===1){var f=m.freq||900,c=clarity(f);
  return head+'<div class="radio"><div class="freq" id="freq">'+(f/10).toFixed(1)+' MHz</div><div class="meter" aria-hidden="true"><i id="clar" style="width:'+Math.round(c*100)+'%"></i></div>'+
   '<label for="tune">Turn the dial until the message comes in clearly.</label><input id="tune" type="range" min="880" max="1080" step="1" value="'+f+'" data-tune="1">'+
   '<div class="sigtxt" id="sigtxt" aria-live="off">'+(c>=.9?'IF YOU CAN HEAR THIS, DO NOT GO LOOKING FOR THE LIGHT':garble(c))+'</div>'+
   (has('radio')?'<p class="muted" style="margin-top:.6rem">Radio operator: strong stations in this region cluster in the mid-90s.</p>':'')+'</div>'+
   '<p style="margin-top:.8rem"><button class="btn" id="lockbtn" data-act="sig-lock"'+(c>=.9?'':' disabled')+'>Lock the signal</button></p>'}
 if(st===2){
  var obs=SIG_OBS.slice();if(SIG_EXTRA[bgd().tag])obs.push(SIG_EXTRA[bgd().tag]);
  obs.sort(function(a,b){return a.id<b.id?-1:1});
  var picks=obs.map(function(o){var on=(m.pick||[]).indexOf(o.id)>-1;
   var r=m.judged?(o.ok?(on?'<b> Good catch.</b>':'<b> You missed this.</b>'):(on?'<b> Not a useful clue.</b>':'')):'';
   return '<label class="pick'+(on?' sel':'')+'"><input type="checkbox" data-sigpick="'+o.id+'"'+(on?' checked':'')+(m.judged?' disabled':'')+'><span>'+esc(o.t)+r+(m.judged&&o.ok?'<br><span class="muted">'+esc(o.w)+'</span>':'')+'</span></label>'}).join('');
  var fb='';
  if(m.judged)fb='<div class="fb"><b>You picked '+m.right+' useful detail'+(m.right===1?'':'s')+'.</b> The pattern points two ways: a recording from someone who knew more than they said, or a person in danger with failing equipment. Neither proves the message is a trap, and neither proves it is safe.</div>';
  return head+'<div class="tx"><p>[CLEAR] If you can hear this, do not go looking for the light.</p><p>[CLEAR] Repeat. If you can hear this, do not go looking for the light.</p><p>[BACKGROUND] A low horn, like a train.</p></div>'+
   '<h3>What stands out? (Choose everything that raises a question.)</h3>'+picks+
   '<h3 style="margin-top:1rem">Can this transmission be trusted?</h3><p class="muted">Explain using at least two of the details you chose.</p><textarea data-bind="m.reason" aria-label="Your reasoning">'+esc(m.reason||'')+'</textarea>'+count('m.reason',25)+
   (m.judged?'':'<p style="margin-top:.6rem"><button class="btn" data-act="sig-judge">Submit analysis</button></p>')+fb+
   (m.judged?'<p><button class="btn" data-act="sig-next">Decide what to do</button></p>':'')}
 if(st===3)return head+'<div class="panel"><p>The message loops again. Your settlement is asleep. You are the only one who has heard it.</p>'+
  (m.checked?'<div class="fb"><b>You count what you have:</b> '+RES.map(function(r){return r[1]+' '+S.res[r[0]]}).join(', ')+'. Every trip costs 1 food and 1 water.</div>':'')+
  '<button class="choice" data-act="sig-dec" data-v="investigate">Investigate the signal<small>Follow it to Abandoned Cincinnati and Hollow Creek. Both open on the map.</small></button>'+
  '<button class="choice" data-act="sig-dec" data-v="ignore">Ignore it, for now<small>Stay safe. You may close off future signals tied to this one.</small></button>'+
  (m.checked?'':'<button class="choice" data-act="sig-dec" data-v="supplies">Check your supplies first<small>Take stock, then decide. It costs nothing but time.</small></button>')+'</div>';
 if(st===4)return head+journalStep('Record what you heard and what you decided. Say what you noticed, what you feel, and why you chose it.','The Signal');
 return head;
},

supply:function(){
 var m=S.m,st=m.step,cap=has('eng')?7:6;
 var head='<h2>The Supply Run</h2>';
 if(st===0)return head+'<div class="panel"><p>A pharmacy and grocery on the first floor of a leaning office tower. The river has taken the street. Water ripples across the lobby tile, and something above you ticks and settles.</p>'+
  '<p>You can carry <b>'+cap+' slots</b>. You cannot take everything.</p>'+(has('out')?'<p class="muted">Outdoorsman: the back stairs are flooded and the ceiling in the east aisle sags. Both are dangerous.</p>':'')+
  '<button class="btn" data-act="sup-start">Go inside</button></div>';
 if(st===1){
  var items=ITEMS.filter(function(i){return !i.hid||S.str==='eyes'});
  var used=(m.take||[]).reduce(function(a,id){return a+itm(id).s},0);
  return head+'<p>Slots used: <b>'+used+' / '+cap+'</b></p>'+(S.str==='eyes'?'<p class="muted">Sharp eyes: you spot a sealed medical cooler behind the counter.</p>':'')+
   '<div class="grid3">'+items.map(function(i){var on=(m.take||[]).indexOf(i.id)>-1,full=!on&&used+i.s>cap;
    return '<button class="opt'+(on?' on':'')+'" data-take="'+i.id+'"'+(full?' disabled style="opacity:.45"':'')+'><b>'+i.n+'</b><small>'+i.s+' slot'+(i.s>1?'s':'')+'. '+i.d+'</small></button>'}).join('')+'</div>'+
   '<p style="margin-top:1rem"><button class="btn" data-act="sup-pack"'+((m.take||[]).length?'':' disabled')+'>Leave with this pack</button></p>'}
 if(st===2)return head+'<div class="panel"><p>As you head for the door, something shifts on the floor above. Dust sifts down through your flashlight beam.</p>'+
  '<button class="choice" data-act="sup-ev" data-v="look"'+(S.res.batt<1?' disabled':'')+'>Climb up and investigate with your flashlight<small>-1 battery</small></button>'+
  (S.str==='quiet'?'<button class="choice" data-act="sup-ev" data-v="sneak">Slip upstairs on silent feet<small>Quiet footsteps: no cost</small></button>':'')+
  '<button class="choice" data-act="sup-ev" data-v="leave">Leave now, quietly</button></div>';
 if(st===3)return head+'<div class="panel"><p>Future survivors will find this place. Leave a warning on the door in <b>20 to 60 words</b>. Name at least two real hazards you saw, and tell them what to do.</p>'+
  '<textarea data-bind="m.warn" aria-label="Your warning">'+esc(m.warn||'')+'</textarea>'+count('m.warn',20,60)+
  '<p style="margin-top:.6rem"><button class="btn" data-act="sup-warn">Post the warning</button></p>'+(m.warnfb||'')+'</div>';
 if(st===4)return head+journalStep('Write about the supply run: what you took, what you left, and what you heard upstairs. Why did you choose what you chose?','The Supply Run');
 return head
},

stranger:function(){
 var m=S.m,st=m.step,head='<h2>The Stranger</h2>';
 var tells=m.tells||[];
 if(st===0)return head+'<div class="panel"><p>At the crossroads, a woman steps out from the burned-out gas station with her hands open and visible. Her jacket is torn. She looks like she has not slept.</p>'+
  '<div class="tx"><p>"I\'m Wren. I walked here from Toledo. Six days. My brother broke his leg falling off a roof. He\'s at the church. Please, I need medicine."</p></div>'+
  (S.flags.warned?'<p class="muted">She glances at your pack. "Someone left a note on a door in Cincinnati. It kept my cousin off a bad floor. Was that you?" Trust +1.</p>':'')+
  '<button class="btn" data-act="str-start">Talk to Wren</button></div>';
 if(st===1){
  var node=m.node||'start',N=strNode(node);
  var ch=N.ch.map(function(c){return '<button class="choice" data-act="str-ch" data-v="'+c.id+'"'+(c.off?' disabled':'')+'>'+esc(c.t)+(c.s?'<small>'+c.s+'</small>':'')+'</button>'}).join('');
  var found=tells.length?'<div class="panel" style="margin-top:1rem"><h3>What you have noticed</h3><ul style="padding-left:1.1rem">'+tells.map(function(t){return '<li>'+esc(TELLS[t])+'</li>'}).join('')+'</ul></div>':'';
  return head+'<div class="tx"><p>'+N.say+'</p></div>'+(N.note?'<p class="muted">'+N.note+'</p>':'')+'<p class="muted">Trust: '+(m.trust||0)+'. Talk to her at least twice, then you can make your decision.</p>'+ch+
   (m.talks>=2?'<button class="btn" data-act="str-next">I\'m ready to decide</button>':'')+found}
 if(st===2)return head+'<div class="panel"><p>Wren will not answer direct questions. Write what you will say to her: <b>2 to 3 lines</b>. Get more truth <b>without accusing her</b>. Use at least one question.</p>'+
  '<textarea data-bind="m.dlg" aria-label="Your dialogue">'+esc(m.dlg||'')+'</textarea>'+count('m.dlg',15)+'<p style="margin-top:.6rem"><button class="btn" data-act="str-say">Say it to Wren</button></p>'+(m.dlgfb||'')+'</div>';
 if(st===3){
  var pk=(m.sus||[]);
  return head+'<div class="panel"><h3>Do you trust her?</h3><p>Choose the tells that make you doubt her story. Then explain your decision.</p>'+
   (tells.length?tells.map(function(t){var on=pk.indexOf(t)>-1;return '<label class="pick'+(on?' sel':'')+'"><input type="checkbox" data-sus="'+t+'"'+(on?' checked':'')+'><span>'+esc(TELLS[t])+'</span></label>'}).join(''):'<p class="muted">You have not noticed any tells.</p>')+
   '<textarea data-bind="m.why" aria-label="Your reasoning" style="margin-top:.5rem">'+esc(m.why||'')+'</textarea>'+count('m.why',25)+'<p style="margin-top:.6rem"><button class="btn" data-act="str-why">Continue to the decision</button></p></div>'}
 if(st===4)return head+'<div class="panel"><p>Wren waits. Your choice will cost something either way.</p>'+
  '<button class="choice" data-act="str-dec" data-v="help"'+(S.res.meds<1?' disabled':'')+'>Help her fully<small>-1 meds, -1 food. She may give you something in return.</small></button>'+
  '<button class="choice" data-act="str-dec" data-v="trade"'+(S.str==='voice'?'':(S.res.meds<1?' disabled':''))+'>Trade for information<small>'+(S.str==='voice'?'Persuasive: you talk her into it for free.':'-1 meds. She tells you what she knows.')+'</small></button>'+
  '<button class="choice" data-act="str-dec" data-v="refuse">Send her away<small>You keep your supplies. You may never learn what she knows.</small></button></div>';
 if(st===5)return head+'<div class="panel"><h3>Radio Haven Ridge</h3><p>Your settlement is waiting for word. You have a few seconds of battery. Send a message of <b>20 words or fewer</b>. It must say <b>what you found</b>, <b>where you are</b>, and <b>what you need</b> or what to watch for.</p>'+
  '<textarea style="min-height:90px" data-bind="m.radio" aria-label="Radio message">'+esc(m.radio||'')+'</textarea>'+count('m.radio',5,20)+'<p style="margin-top:.6rem"><button class="btn" data-act="str-radio">Transmit</button></p>'+(m.radiofb||'')+'</div>';
 if(st===6)return head+journalStep('Write about Wren. What did you notice, what did you choose, and what do you still not know?','The Stranger');
 return head
}
};
function itm(id){return ITEMS.filter(function(i){return i.id===id})[0]}
function strNode(n){
 var m=S.m,P=S.pers,B=bgd().tag,t=function(id){return (m.tells||[]).indexOf(id)>-1};
 var ch=[],say='',note='';
 if(n==='start'){say='"Please. Every hour matters. What do you want to know?"';
  ch=[{id:'brother',t:'Ask what is wrong with her brother.'},{id:'inspect',t:'Look at her more closely.'},{id:'route',t:'Ask where she slept on the way.'}];
  if(P==='suspicious')ch.push({id:'press',t:'"Your story has holes. Start over."',s:'Suspicious'});
  if(P==='empathetic')ch.push({id:'comfort',t:'Tell her you understand how frightening this is.',s:'Empathetic'});
  if(P==='bold')ch.push({id:'block',t:'Step into the road and tell her she is not going anywhere until you hear the truth.',s:'Bold'});
  if(P==='cautious')ch.push({id:'watch',t:'Keep your distance and watch the road with her.',s:'Cautious'});
 }else{say=m.say||'';ch=[{id:'again',t:'Ask something else.'}]}
 if(n!=='start'){say=m.say;note=m.note;ch=strNode('start').ch}
 ch.forEach(function(c){c.off=!!(m.used&&m.used[c.id])});
 return {say:say,note:note,ch:ch}
}
function strTalk(id){
 var m=S.m;m.used=m.used||{};if(m.used[id])return;m.used[id]=true;m.tells=m.tells||[];m.talks=(m.talks||0)+1;m.trust=m.trust||(S.flags.warned?1:0);
 function tell(k){if(m.tells.indexOf(k)<0){m.tells.push(k);if(m.tells.length>=4)award('tells')}}
 var say='',note='';
 if(id==='brother'){tell('story');say='"He has... a fever now. It\'s in his chest. He coughs. It\'s the infection from his leg, I think. He\'s getting worse."';note='Earlier she said a broken leg. Now she describes a fever and a cough.'}
 else if(id==='inspect'){
  if(S.weak!=='trust')tell('clay');tell('badge');
  say='"Why are you staring? I\'m just tired."';
  note=(S.weak==='trust'?'You notice the badge clipped inside her jacket. Your trusting nature makes you skim over the rest. ':'You notice her boots, caked in red clay, and a hospital badge inside her jacket. ')+(has('med')?'Medical assistant: the way she touches the badge is practiced, like someone who wore it every shift. ':'')+(has('mil')?'Military family: she stands where she can see both exits.':'');
  if(has('mil'))tell('road')}
 else if(id==='route'){tell('never');if(S.weak==='trust'&&m.tells.indexOf('clay')<0)tell('clay');say='"I slept in barns. I\'ve never been south of Columbus in my life. I don\'t know this country."';note='Keep that line in mind.'}
 else if(id==='press'){m.trust--;tell('story');say='"You think I\'m lying? Fine. My brother... it\'s his leg, his chest, I don\'t know. I\'m not a doctor!"';note='She snapped, then stopped herself. Trust -1.'}
 else if(id==='comfort'){m.trust++;tell('road');say='"Thank you. I... haven\'t been spoken to kindly in a long time." She glances back down the road.';note='Empathy lowers her guard. Trust +1.'}
 else if(id==='block'){m.trust--;tell('road');say='"Move! They could be right behind me." She catches herself.';note='She is more afraid of something behind her than of you. Trust -1.'}
 else if(id==='watch'){tell('road');say='"You see it too. Nothing. Yet."';note='Standing together, you notice she keeps checking the road behind her.'}
 m.say=say;m.note=note;m.node='x';
}

/* ---------- rendering ---------- */
function render(){
 var f=SCREENS[S.screen]||SCREENS.title;
 if(S.screen==='mission'&&!S.m){S.screen='map';f=SCREENS.map}
 document.getElementById('app').innerHTML=f();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act],[data-go],[data-loc],[data-cr],[data-take]');if(!el)return;
 if(el.dataset.act==='sound'){S.sound=el.checked;if(!S.sound)staticOff();save();return}
 if(el.dataset.go){ev.preventDefault();go(el.dataset.go);return}
 if(el.dataset.loc){S.sel=el.dataset.loc;save();render();return}
 if(el.dataset.cr){var p=el.dataset.cr.split(':');S.cr[p[0]]=p[1];save();render();return}
 if(el.dataset.take){var m=S.m;m.take=m.take||[];var i=m.take.indexOf(el.dataset.take);if(i>-1)m.take.splice(i,1);else m.take.push(el.dataset.take);save();render();return}
 var a=el.dataset.act;if(!a)return;ev.preventDefault();
 var m=S.m;
 if(a==='menu'){staticOff();S.screen='menu';save();render();window.scrollTo(0,0)}
 else if(a==='resume'){S.screen=S.m?'mission':'map';save();render()}
 else if(a==='newgame'){if(S.started&&!confirm('Start a new game? This erases your current progress unless you exported it.'))return;var sd=S.sound;S=fresh();S.sound=sd;S.screen='create';save();render()}
 else if(a==='start'){var c=S.cr;
  if((c.name||'').trim().length<2){toast('Enter a name for your survivor.');return}
  if(!c.bg||!c.pers||!c.str||!c.weak){toast('Choose a background, personality, strength, and weakness.');return}
  S.name=c.name.trim();S.bg=c.bg;S.pers=c.pers;S.str=c.str;S.weak=c.weak;
  var b=bgd();Object.keys(b.res).forEach(function(k){S.res[k]+=b.res[k]});
  if(c.weak==='thirst')S.res.water=Math.max(0,S.res.water-1);if(c.weak==='nerves')S.res.batt=Math.max(0,S.res.batt-1);
  S.started=true;S.screen='map';S.sel='home';logIt('Survivor '+S.name+' wakes in Haven Ridge. The radio is speaking.');save();render();window.scrollTo(0,0)}
 else if(a==='travel'){
  var k=S.sel,o=LOCS[k];if(locState(k)==='lock'||S.done[o.m])return;
  if(k!=='home'){S.cp=null;S.cp=snap();advance(1);logIt('Traveled to '+o.n+'.');if(S.screen==='over'){save();render();return}}
  newM(o.m);save();render();window.scrollTo(0,0)}
 else if(a==='backmap'){S.m=null;S.screen='map';staticOff();save();render()}
 else if(a==='retry'){if(S.cp){var sv=S.sound,ac2=S.ach;S=JSON.parse(S.cp);S.sound=sv;for(var q in ac2)S.ach[q]=true;S.screen='map';S.cp=null;save();render()}}
 else if(a==='addjournal'){if(wc(S.extra)<20){toast('Write at least 20 words.');return}S.journal.push({day:S.day,title:'Personal entry',text:S.extra.trim()});S.extra='';xp(5,'Journal entry');save();render()}
 else if(a==='savejournal'){finishM(el.dataset.title,25)}
 /* signal */
 else if(a==='sig-power'){
  if(!has('mech')&&!S.flags.crank){if(S.res.batt<1){toast('No batteries. Find some, or a hand-crank radio.');return}S.res.batt--}
  m.step=1;m.freq=900;staticOn();staticSet(1);save();render()}
 else if(a==='sig-lock'){staticOff();blip(520,.2);award('tuned');xp(10,'Signal locked');m.step=2;save();render()}
 else if(a==='sig-judge'){
  var obs=SIG_OBS.slice();if(SIG_EXTRA[bgd().tag])obs.push(SIG_EXTRA[bgd().tag]);
  var pk=m.pick||[],right=obs.filter(function(o){return o.ok&&pk.indexOf(o.id)>-1}).length,wrong=obs.filter(function(o){return !o.ok&&pk.indexOf(o.id)>-1}).length;
  if(wc(m.reason)<25){toast('Explain your reasoning in at least 25 words.');return}
  m.right=right;m.judged=true;xp(Math.max(0,right-wrong)*7+10,'Signal analysis');if(right>=3)award('doubt');save();render()}
 else if(a==='sig-next'){m.step=3;save();render()}
 else if(a==='sig-dec'){var v=el.dataset.v,F=S.flags;F.heard=true;
  if(v==='investigate'){F.investigate=true;logIt('Chose to investigate the signal.')}
  else if(v==='ignore'){F.ignored=true;logIt('Chose to ignore the signal. Some signals may now stay silent.')}
  else{F.supplies=true;m.checked=true;logIt('Took stock of supplies before deciding.');save();render();return}
  m.step=4;save();render()}
 /* supply */
 else if(a==='sup-start'){m.step=1;save();render()}
 else if(a==='sup-pack'){
  var take=m.take||[];take.forEach(function(id){var i=itm(id);
   if(i.fx)Object.keys(i.fx).forEach(function(k){S.res[k]+=i.fx[k]});
   if(i.flag)S.flags[i.flag]=true;if(i.clue)clue(i.clue);S.inv.push(i.n)});
  logIt('Packed '+take.length+' items from Abandoned Cincinnati.');award('bag');xp(15,'Smart packing');m.step=2;save();render()}
 else if(a==='sup-ev'){var v2=el.dataset.v;
  if(v2==='look'){S.res.batt--;clue('A survivor\'s notebook upstairs: "They told us not to follow the light. We went anyway."');logIt('Found a survivor\'s notebook upstairs.');xp(10,'You investigated')}
  else if(v2==='sneak'){clue('A survivor\'s notebook upstairs: "They told us not to follow the light. We went anyway."');logIt('Slipped upstairs and found a notebook.');xp(10,'Quiet and careful')}
  else{logIt('Left the noise upstairs alone.')}
  m.step=3;save();render()}
 else if(a==='sup-warn'){
